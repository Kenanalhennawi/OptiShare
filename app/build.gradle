plugins {
    id 'com.android.application'
}

android {
    namespace 'com.kenan.optishare'
    compileSdk 35

    defaultConfig {
        applicationId 'com.kenan.optishare'
        minSdk 23
        targetSdk 35
        versionCode 7
        versionName '0.6.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    signingConfigs {
        release {
            def storeFilePath = findProperty('OPTISHARE_STORE_FILE')
            if (storeFilePath) {
                storeFile file(storeFilePath)
                storePassword findProperty('OPTISHARE_STORE_PASSWORD')
                keyAlias findProperty('OPTISHARE_KEY_ALIAS')
                keyPassword findProperty('OPTISHARE_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (findProperty('OPTISHARE_STORE_FILE')) {
                signingConfig signingConfigs.release
            }
        }
    }
}

dependencies {
    implementation 'androidx.activity:activity:1.10.1'
    implementation 'androidx.camera:camera-core:1.4.2'
    implementation 'androidx.camera:camera-camera2:1.4.2'
    implementation 'androidx.camera:camera-lifecycle:1.4.2'
    implementation 'androidx.camera:camera-view:1.4.2'
}
