name: Patch OptiShare 2.2 LAN Fallback

on:
  push:
    branches: ['feature/v2.2-fast-transfer']
    paths: ['.github/workflows/patch-v22-lan-fallback.yml']

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v2.2-fast-transfer
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Apply LAN fallback integration
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # TransferService: advertise receiver over mDNS while foreground receiver is active.
          p=Path('app/src/main/java/com/kenan/optishare/transfer/TransferService.java')
          s=p.read_text()
          s=s.replace('import com.kenan.optishare.V2Activity;\n', 'import com.kenan.optishare.V2Activity;\nimport com.kenan.optishare.device.DeviceIdentity;\n', 1)
          old='''    private SenderSessionStore senderStore;\n    private WifiDirectRecovery wifiRecovery;'''
          new='''    private SenderSessionStore senderStore;\n    private WifiDirectRecovery wifiRecovery;\n    private LanDiscovery lanDiscovery;'''
          assert old in s
          s=s.replace(old,new,1)
          old='''        senderStore = new SenderSessionStore(this);\n        wifiRecovery = new WifiDirectRecovery(this);\n        createChannel();'''
          new='''        senderStore = new SenderSessionStore(this);\n        wifiRecovery = new WifiDirectRecovery(this);\n        lanDiscovery = new LanDiscovery(this);\n        createChannel();'''
          assert old in s
          s=s.replace(old,new,1)
          old='''        latestBatchDone = 0L;\n        latestSpeed = 0d;\n        updateNotification("Ready to receive", "Waiting for a nearby OptiShare sender", 0, false);\n        broadcast("receiver_ready", "Waiting for sender…", 0, 0, null);'''
          new='''        latestBatchDone = 0L;\n        latestSpeed = 0d;\n        lanDiscovery.advertise(new DeviceIdentity(this).name(), PORT, new LanDiscovery.Listener() {\n            @Override public void onPeer(String name, String host) { }\n            @Override public void onStatus(String message) {\n                broadcast("receiver_ready", message + " • Wi-Fi Direct also available when supported", 0, 0, null);\n            }\n        });\n        updateNotification("Ready to receive", "Waiting via Wi-Fi Direct or the same Wi-Fi network", 0, false);\n        broadcast("receiver_ready", "Waiting via Wi-Fi Direct or same Wi-Fi…", 0, 0, null);'''
          assert old in s
          s=s.replace(old,new,1)
          old='''            } finally {\n                running.set(false);\n                serverSocket = null;\n                stopForeground(true);'''
          new='''            } finally {\n                running.set(false);\n                lanDiscovery.stopAdvertising();\n                serverSocket = null;\n                stopForeground(true);'''
          assert old in s
          s=s.replace(old,new,1)
          old='''        if (userCancelled && senderStore != null) senderStore.clear();\n        closeSocket();'''
          new='''        if (userCancelled && senderStore != null) senderStore.clear();\n        if (lanDiscovery != null) lanDiscovery.stopAdvertising();\n        closeSocket();'''
          assert old in s
          s=s.replace(old,new,1)
          old='''        running.set(false);\n        IncomingApproval.cancel();\n        closeSocket();'''
          new='''        running.set(false);\n        IncomingApproval.cancel();\n        if (lanDiscovery != null) lanDiscovery.close();\n        closeSocket();'''
          # replace only onDestroy occurrence after its signature
          marker='''    @Override public void onDestroy() {\n        running.set(false);\n        IncomingApproval.cancel();\n        closeSocket();'''
          replacement='''    @Override public void onDestroy() {\n        running.set(false);\n        IncomingApproval.cancel();\n        if (lanDiscovery != null) lanDiscovery.close();\n        closeSocket();'''
          assert marker in s
          s=s.replace(marker,replacement,1)
          p.write_text(s)

          # Activity: discover LAN in parallel, auto-fallback only when Direct has not produced peers.
          p=Path('app/src/main/java/com/kenan/optishare/V2Activity.java')
          s=p.read_text()
          s=s.replace('import com.kenan.optishare.transfer.TransferService;\n', 'import com.kenan.optishare.transfer.LanDiscovery;\nimport com.kenan.optishare.transfer.TransferService;\n', 1)
          old='''    private DeviceIdentity identity;\n    private TransferHistoryStore historyStore;\n    private long activeTransferStartedAt;'''
          new='''    private DeviceIdentity identity;\n    private TransferHistoryStore historyStore;\n    private LanDiscovery lanDiscovery;\n    private String pendingLanHost;\n    private String pendingLanName;\n    private long activeTransferStartedAt;'''
          assert old in s
          s=s.replace(old,new,1)
          old='''    private final Runnable discoveryRetry = () -> {\n        if (currentScreen == SCREEN_DISCOVERY && !transferStarted && peers.isEmpty()) {\n            runDiscoveryPass();\n        }\n    };'''
          new='''    private final Runnable discoveryRetry = () -> {\n        if (currentScreen == SCREEN_DISCOVERY && !transferStarted && peers.isEmpty()) {\n            runDiscoveryPass();\n        }\n    };\n    private final Runnable lanFallbackConnect = () -> {\n        if (currentScreen == SCREEN_DISCOVERY && !transferStarted && peers.isEmpty()\n                && pendingLanHost != null) {\n            connectViaLan(pendingLanName, pendingLanHost);\n        }\n    };'''
          assert old in s
          s=s.replace(old,new,1)
          old='''        identity = new DeviceIdentity(this);\n        historyStore = new TransferHistoryStore(this);\n        manager = (WifiP2pManager) getSystemService(WIFI_P2P_SERVICE);'''
          new='''        identity = new DeviceIdentity(this);\n        historyStore = new TransferHistoryStore(this);\n        lanDiscovery = new LanDiscovery(this);\n        manager = (WifiP2pManager) getSystemService(WIFI_P2P_SERVICE);'''
          assert old in s
          s=s.replace(old,new,1)
          old='''        } else if ("incoming".equals(event)) {\n                setTransferUi("Incoming batch", message, 0);'''
          new='''        } else if ("receiver_ready".equals(event)) {\n                setDiscoveryText(message);\n                setConnectionUi("READY • DIRECT + WI-FI", Color.rgb(65, 222, 151));\n            } else if ("incoming".equals(event)) {\n                setTransferUi("Incoming batch", message, 0);'''
          assert old in s
          s=s.replace(old,new,1)
          old='''        setContentView(scroll);startReceiverMode();\n    }'''
          new='''        setContentView(scroll);startReceiverService();startReceiverMode();\n    }'''
          assert old in s
          s=s.replace(old,new,1)
          old='''    private void startDiscovery() {\n        if(!ensureNearbyReady())return;\n        discoveryHandler.removeCallbacks(discoveryRetry);\n        discoveryAttempt=0;'''
          new='''    private void startDiscovery() {\n        discoveryHandler.removeCallbacks(discoveryRetry);\n        discoveryHandler.removeCallbacks(lanFallbackConnect);\n        pendingLanHost=null;pendingLanName=null;\n        startLanDiscovery();\n        if(!ensureNearbyReady())return;\n        discoveryAttempt=0;'''
          assert old in s
          s=s.replace(old,new,1)
          anchor='''    private void runDiscoveryPass() {'''
          insert='''    private void startLanDiscovery() {\n        if(lanDiscovery==null||!lanDiscovery.available())return;\n        lanDiscovery.stopDiscovery();\n        lanDiscovery.discover(new LanDiscovery.Listener(){\n            @Override public void onPeer(String name,String host){\n                runOnUiThread(()->{\n                    if(currentScreen!=SCREEN_DISCOVERY||transferStarted)return;\n                    pendingLanName=name;pendingLanHost=host;\n                    if(peers.isEmpty()){\n                        setDiscoveryText("Found "+name+" on the same Wi-Fi • giving Wi-Fi Direct a moment…");\n                        discoveryHandler.removeCallbacks(lanFallbackConnect);\n                        discoveryHandler.postDelayed(lanFallbackConnect,4500L);\n                    }\n                });\n            }\n            @Override public void onStatus(String message){\n                if(currentScreen==SCREEN_DISCOVERY&&peers.isEmpty()&&pendingLanHost==null)setDiscoveryText(message);\n            }\n        });\n    }\n\n    private void stopLanDiscovery(){\n        discoveryHandler.removeCallbacks(lanFallbackConnect);\n        if(lanDiscovery!=null)lanDiscovery.stopDiscovery();\n    }\n\n    private void connectViaLan(String name,String host){\n        if(host==null||host.trim().isEmpty()||transferStarted)return;\n        transferStarted=true;\n        activeTransferStartedAt=System.currentTimeMillis();\n        connectedPeerName=(name==null||name.trim().isEmpty()?"OptiShare device":name)+" • same Wi-Fi";\n        discoveryHandler.removeCallbacks(discoveryRetry);\n        stopLanDiscovery();\n        showTransferScreen("Sending");\n        setConnectionUi("SAME WI-FI ✓",Color.rgb(65,225,151));\n        setTransferUi("Connecting over local Wi-Fi","Using the encrypted OptiShare transport without Internet",0);\n        startSenderService(host);\n    }\n\n'''+anchor
          assert anchor in s
          s=s.replace(anchor,insert,1)
          old='''        renderPeers();if(currentScreen==SCREEN_DISCOVERY){if(peers.isEmpty()){scheduleDiscoveryRetry();}else{discoveryHandler.removeCallbacks(discoveryRetry);setDiscoveryText(peers.size()+" nearby device"+(peers.size()==1?"":"s")+" found ✓");}}'''
          new='''        renderPeers();if(currentScreen==SCREEN_DISCOVERY){if(peers.isEmpty()){scheduleDiscoveryRetry();if(pendingLanHost!=null){discoveryHandler.removeCallbacks(lanFallbackConnect);discoveryHandler.postDelayed(lanFallbackConnect,1200L);}}else{discoveryHandler.removeCallbacks(discoveryRetry);discoveryHandler.removeCallbacks(lanFallbackConnect);setDiscoveryText(peers.size()+" Wi-Fi Direct device"+(peers.size()==1?"":"s")+" found ✓");}}'''
          assert old in s
          s=s.replace(old,new,1)
          old='''        if(!ensureNearbyReady())return;discoveryHandler.removeCallbacks(discoveryRetry);connectedPeerName=deviceName(device);'''
          new='''        if(!ensureNearbyReady())return;discoveryHandler.removeCallbacks(discoveryRetry);stopLanDiscovery();connectedPeerName=deviceName(device);'''
          assert old in s
          s=s.replace(old,new,1)
          old='''        else if(!receiverMode&&!info.isGroupOwner&&!transferStarted){transferStarted=true;activeTransferStartedAt=System.currentTimeMillis();showTransferScreen("Sending");startSenderService(info.groupOwnerAddress.getHostAddress());}'''
          new='''        else if(!receiverMode&&!info.isGroupOwner&&!transferStarted){transferStarted=true;stopLanDiscovery();activeTransferStartedAt=System.currentTimeMillis();showTransferScreen("Sending");startSenderService(info.groupOwnerAddress.getHostAddress());}'''
          assert old in s
          s=s.replace(old,new,1)
          old='''    @Override protected void onPause(){super.onPause();discoveryHandler.removeCallbacks(discoveryRetry);try{unregisterReceiver(p2pReceiver);}catch(Exception ignored){}try{unregisterReceiver(transferReceiver);}catch(Exception ignored){}}\n    @Override protected void onDestroy(){super.onDestroy();}'''
          new='''    @Override protected void onPause(){super.onPause();discoveryHandler.removeCallbacks(discoveryRetry);stopLanDiscovery();try{unregisterReceiver(p2pReceiver);}catch(Exception ignored){}try{unregisterReceiver(transferReceiver);}catch(Exception ignored){}}\n    @Override protected void onDestroy(){if(lanDiscovery!=null)lanDiscovery.close();super.onDestroy();}'''
          assert old in s
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
          git diff --check
          git diff -- app/src/main/java/com/kenan/optishare/transfer/TransferService.java app/src/main/java/com/kenan/optishare/V2Activity.java

      - name: Compile and test LAN fallback
        run: gradle --no-daemon --stacktrace testDebugUnitTest testReleaseUnitTest lintDebug assembleDebug

      - name: Commit verified LAN fallback
        shell: bash
        run: |
          git config user.name "Kenanalhennawi"
          git config user.email "135068266+Kenanalhennawi@users.noreply.github.com"
          git add app/src/main/java/com/kenan/optishare/transfer/TransferService.java app/src/main/java/com/kenan/optishare/V2Activity.java
          git commit -m "feat: auto fallback to encrypted same-Wi-Fi transfer"
          git push origin HEAD:feature/v2.2-fast-transfer
