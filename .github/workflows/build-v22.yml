name: Build OptiShare 2.2 Fast Transfer

on:
  push:
    branches:
      - feature/v2.2-fast-transfer
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: optishare-2.2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-emulator-smoke:
    name: Android RC emulator smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install, launch and navigate Android RC
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: Nexus 6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: gradle --no-daemon --stacktrace connectedDebugAndroidTest

      - name: Upload emulator reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OptiShare-2.2-emulator-reports
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: ignore
          retention-days: 14

  build:
    name: Test, build, MobSF and verify 2.2
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      OPTISHARE_KEYSTORE_B64: ${{ secrets.OPTISHARE_KEYSTORE_B64 }}
      OPTISHARE_STORE_PASSWORD: ${{ secrets.OPTISHARE_STORE_PASSWORD }}
      OPTISHARE_KEY_ALIAS: ${{ secrets.OPTISHARE_KEY_ALIAS }}
      OPTISHARE_KEY_PASSWORD: ${{ secrets.OPTISHARE_KEY_PASSWORD }}
      EXPECTED_CERT_SHA256: c408ec09bdfa5b6186591a1beafa333323f8fc5f205b418116129bd3f90f60e3
      EXPECTED_JKS_SHA256: edc91c288d98396d9c8bbb1540f90e536ce6758ae0355f1d724fbf2df0f52531

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Verify preinstalled Android SDK
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ANDROID_HOME:-}" || { echo '::error::ANDROID_HOME is not set'; exit 1; }
          test -d "$ANDROID_HOME/platforms/android-36" || { echo '::error::Android SDK 36 is not preinstalled'; exit 1; }
          test -x "$ANDROID_HOME/build-tools/35.0.0/apksigner" || { echo '::error::apksigner 35.0.0 is not preinstalled'; exit 1; }

      - name: Verify privacy and dependency baseline
        shell: bash
        run: |
          set -euo pipefail
          test -s docs/google-play/privacy-policy.html || { echo '::error::Missing Google Play privacy policy'; exit 1; }
          test -s docs/google-play/data-safety.md || { echo '::error::Missing Google Play Data safety record'; exit 1; }
          if rg -n -i \
            'firebase-analytics|play-services-ads|appsflyer|adjust-android|facebook-android-sdk|mixpanel|amplitude' \
            --glob '*.gradle' --glob '*.gradle.kts' --glob 'libs.versions.toml' .; then
            echo '::error::Advertising, attribution, or analytics dependency detected'
            exit 1
          fi
          MANIFEST=app/src/main/AndroidManifest.xml
          grep -q 'android:allowBackup="false"' "$MANIFEST" || { echo '::error::Backups must remain disabled'; exit 1; }
          grep -q 'android:usesCleartextTraffic="false"' "$MANIFEST" || { echo '::error::Internet cleartext must remain disabled'; exit 1; }

      - name: Quality gate and fast-transfer tests
        run: >-
          gradle --no-daemon --stacktrace clean
          testDebugUnitTest testReleaseUnitTest
          lintDebug lintRelease assembleDebug

      - name: Validate signing secrets exist
        shell: bash
        run: |
          set -euo pipefail
          test -n "$OPTISHARE_KEYSTORE_B64" || { echo '::error::Missing OPTISHARE_KEYSTORE_B64'; exit 1; }
          test -n "$OPTISHARE_STORE_PASSWORD" || { echo '::error::Missing OPTISHARE_STORE_PASSWORD'; exit 1; }
          test -n "$OPTISHARE_KEY_ALIAS" || { echo '::error::Missing OPTISHARE_KEY_ALIAS'; exit 1; }
          test -n "$OPTISHARE_KEY_PASSWORD" || { echo '::error::Missing OPTISHARE_KEY_PASSWORD'; exit 1; }

      - name: Restore release keystore
        shell: bash
        run: |
          set -euo pipefail
          echo "$OPTISHARE_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/optishare-release.jks"
          chmod 600 "$RUNNER_TEMP/optishare-release.jks"
          ACTUAL_JKS_SHA256=$(sha256sum "$RUNNER_TEMP/optishare-release.jks" | awk '{print $1}')
          test "$ACTUAL_JKS_SHA256" = "$EXPECTED_JKS_SHA256" || {
            echo "::error::Keystore SHA-256 mismatch: $ACTUAL_JKS_SHA256"
            exit 1
          }
          keytool -list \
            -keystore "$RUNNER_TEMP/optishare-release.jks" \
            -storepass "$OPTISHARE_STORE_PASSWORD" \
            -alias "$OPTISHARE_KEY_ALIAS" >/dev/null

      - name: Build signed 2.2 APK and AAB
        env:
          ORG_GRADLE_PROJECT_OPTISHARE_STORE_FILE: ${{ runner.temp }}/optishare-release.jks
          ORG_GRADLE_PROJECT_OPTISHARE_STORE_PASSWORD: ${{ env.OPTISHARE_STORE_PASSWORD }}
          ORG_GRADLE_PROJECT_OPTISHARE_KEY_ALIAS: ${{ env.OPTISHARE_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_OPTISHARE_KEY_PASSWORD: ${{ env.OPTISHARE_KEY_PASSWORD }}
        run: gradle --no-daemon --stacktrace assembleRelease bundleRelease

      - name: Verify signed APK
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          AAB=app/build/outputs/bundle/release/app-release.aab
          test -s "$APK"
          test -s "$AAB"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" | tee "$RUNNER_TEMP/apksigner.txt"
          ACTUAL_CERT=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/apksigner.txt" | head -n1 | tr '[:upper:]' '[:lower:]' | tr -d ':[:space:]')
          test "$ACTUAL_CERT" = "$EXPECTED_CERT_SHA256" || {
            echo "::error::Unexpected signer: $ACTUAL_CERT"
            exit 1
          }

      - name: Prepare 2.2 artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-output
          cp app/build/outputs/apk/release/app-release.apk release-output/OptiShare-2.2-FAST-SIGNED.apk
          cp app/build/outputs/bundle/release/app-release.aab release-output/OptiShare-2.2-FAST-Play.aab
          (
            cd release-output
            sha256sum OptiShare-2.2-FAST-SIGNED.apk OptiShare-2.2-FAST-Play.aab > SHA256SUMS.txt
          )
          {
            echo 'version=2.2.0-rc1'
            echo 'version_code=221'
            echo 'release_scope=android-only'
            echo 'chunk_bytes=1572864'
            echo 'checkpoint_chunks=4'
            echo 'checkpoint_window_bytes=6291456'
            echo 'pc_route_protocol=1'
            echo 'transfer_queue=per-file-status-reorder-resume'
            echo "commit=${GITHUB_SHA}"
            echo "signer_sha256=${EXPECTED_CERT_SHA256}"
          } > release-output/BUILD_INFO.txt

      - name: Start pinned MobSF 4.5.2
        shell: bash
        run: |
          set -euo pipefail
          MOBSF_API_KEY=$(openssl rand -hex 32)
          echo "::add-mask::$MOBSF_API_KEY"
          echo "MOBSF_API_KEY=$MOBSF_API_KEY" >> "$GITHUB_ENV"
          docker run --detach --name optishare-mobsf \
            --publish 127.0.0.1:8000:8000 \
            --env "MOBSF_API_KEY=$MOBSF_API_KEY" \
            opensecurity/mobile-security-framework-mobsf@sha256:af94f81f8b13872cdf556327fab58f52d446299fe153be6e1eeec177f31b503b
          for _ in $(seq 1 90); do
            if curl --fail --silent --show-error http://127.0.0.1:8000/login/ >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker logs optishare-mobsf
          echo "::error::MobSF did not become ready."
          exit 1

      - name: Full MobSF scan of signed release APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p security-reports/mobsf-apk
          APK=release-output/OptiShare-2.2-FAST-SIGNED.apk
          AUTH_HEADER="X-Mobsf-Api-Key: $MOBSF_API_KEY"

          curl --fail-with-body --silent --show-error \
            --header "$AUTH_HEADER" \
            --form "file=@$APK" \
            http://127.0.0.1:8000/api/v1/upload \
            --output security-reports/mobsf-apk/upload.json

          scan_hash=$(jq -er '.hash' security-reports/mobsf-apk/upload.json)
          scan_type=$(jq -er '.scan_type' security-reports/mobsf-apk/upload.json)
          file_name=$(jq -er '.file_name' security-reports/mobsf-apk/upload.json)

          curl --fail-with-body --silent --show-error --max-time 1200 \
            --header "$AUTH_HEADER" \
            --request POST \
            --data-urlencode "hash=$scan_hash" \
            --data-urlencode "scan_type=$scan_type" \
            --data-urlencode "file_name=$file_name" \
            http://127.0.0.1:8000/api/v1/scan \
            --output security-reports/mobsf-apk/scan-response.json

          jq -e 'type == "object" and (.error | not)' \
            security-reports/mobsf-apk/scan-response.json >/dev/null

          curl --fail-with-body --silent --show-error \
            --header "$AUTH_HEADER" \
            --request POST \
            --data-urlencode "hash=$scan_hash" \
            http://127.0.0.1:8000/api/v1/report_json \
            --output security-reports/mobsf-apk/report.json

          curl --fail-with-body --silent --show-error \
            --header "$AUTH_HEADER" \
            --request POST \
            --data-urlencode "hash=$scan_hash" \
            http://127.0.0.1:8000/api/v1/download_pdf \
            --output security-reports/mobsf-apk/report.pdf

          jq -e 'type == "object" and (.error | not)' \
            security-reports/mobsf-apk/report.json >/dev/null
          test -s security-reports/mobsf-apk/report.pdf
          apk_target_sdk=$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" \
            | sed -n "s/.*targetSdkVersion:'\\([0-9][0-9]*\\)'.*/\\1/p" | head -n1)
          source_target_sdk=$(awk '/targetSdk[[:space:]]+[0-9]+/ { print $2; exit }' app/build.gradle)
          if [[ -z "$apk_target_sdk" || "$apk_target_sdk" != "$source_target_sdk" ]]; then
            echo "::error::APK target SDK could not be verified against Gradle."
            exit 1
          fi
          test "$apk_target_sdk" -ge 29 || {
            echo "::error::MobSF StrandHogg exception requires targetSdk 29 or newer."
            exit 1
          }

          cert_matches=$(jq --arg cert "$EXPECTED_CERT_SHA256" \
            '[.certificate_analysis.certificate_info
              | ascii_downcase
              | contains($cert)] | all' security-reports/mobsf-apk/report.json)
          test "$cert_matches" = true || {
            echo "::error::MobSF report certificate does not match the protected release signer."
            exit 1
          }

          unexpected_high=$(jq '
            [
              .manifest_analysis.manifest_findings[]?
              | select(.severity == "high" and .rule != "task_hijacking2")
            ] +
            [
              .code_analysis.findings[]?
              | select(.metadata.severity == "high")
            ] +
            [
              .binary_analysis[]?, .file_analysis[]?, .network_security.network_findings[]?
              | select((.severity // "") == "high")
            ] | length' security-reports/mobsf-apk/report.json)
          test "$unexpected_high" -eq 0 || {
            echo "::error::MobSF found an unexpected High severity issue."
            exit 1
          }

          tracker_count=$(jq -er '.trackers.detected_trackers' security-reports/mobsf-apk/report.json)
          test "$tracker_count" -eq 0 || {
            echo "::error::MobSF detected privacy trackers."
            exit 1
          }

          unexpected_secrets=$(jq '
            [.secrets[]?
             | select(
                 ((contains("library_zxingandroidembedded_author"))
                  and (contains("JourneyApps") or contains("https://journeyapps.com/"))) | not
               )] | length' security-reports/mobsf-apk/report.json)
          test "$unexpected_secrets" -eq 0 || {
            echo "::error::MobSF detected an unreviewed embedded secret."
            exit 1
          }

          jq --argjson target_sdk "$apk_target_sdk" \
             --argjson unexpected_high "$unexpected_high" \
             --argjson trackers "$tracker_count" \
             --argjson unexpected_secrets "$unexpected_secrets" \
            '{
              verified_apk_target_sdk: $target_sdk,
              unexpected_high_findings: $unexpected_high,
              detected_trackers: $trackers,
              unexpected_secrets: $unexpected_secrets,
              strandhogg_finding_review: "MobSF parser omitted targetSdk; APK targetSdk independently verified >= 29",
              release_gate: "pass"
            }' security-reports/mobsf-apk/report.json \
            > security-reports/mobsf-apk/policy-gate.json

          jq '{
            app_name,
            package_name,
            version_name,
            security_score,
            trackers,
            certificate_analysis,
            manifest_analysis,
            network_security
          }' security-reports/mobsf-apk/report.json \
            > security-reports/mobsf-apk/review-summary.json

      - name: Upload full MobSF signed APK reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OptiShare-2.2-MobSF-signed-APK
          path: security-reports/mobsf-apk/
          if-no-files-found: warn
          retention-days: 30

      - name: Stop MobSF
        if: always()
        shell: bash
        run: |
          docker logs optishare-mobsf > "$RUNNER_TEMP/mobsf-container.log" 2>&1 || true
          docker rm --force optishare-mobsf >/dev/null 2>&1 || true

      - name: Upload 2.2 debug APK
        uses: actions/upload-artifact@v4
        with:
          name: OptiShare-2.2-fast-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload 2.2 signed release
        uses: actions/upload-artifact@v4
        with:
          name: OptiShare-2.2-FAST-SIGNED
          path: |
            release-output/OptiShare-2.2-FAST-SIGNED.apk
            release-output/OptiShare-2.2-FAST-Play.aab
            release-output/SHA256SUMS.txt
            release-output/BUILD_INFO.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload quality reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OptiShare-2.2-quality-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.*
            app/build/reports/lint-results-release.*
          if-no-files-found: ignore
          retention-days: 14

  windows-companion:
    name: Build Windows companion EXE
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Parse embedded PowerShell receiver sources
        shell: powershell
        run: |
          foreach ($file in @('windows/OptiShare-Companion.ps1','windows/OptiShare-PC-Receiver.ps1')) {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file),
              [ref]$null,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error ("$file : " + $_.Message) }
              exit 1
            }
          }

      - name: Build self-contained x64 EXE
        shell: powershell
        run: |
          if (Select-String -Path windows/launcher/*.cs -Pattern 'powershell\.exe|ProcessStartInfo.*powershell' -Quiet) {
            throw 'Native Companion must not launch PowerShell'
          }
          if (Select-String -Path windows/launcher/OptiShareLauncher.csproj -Pattern 'EmbeddedResource.*\.ps1' -Quiet) {
            throw 'Native Companion must not embed PowerShell scripts'
          }
          dotnet publish windows/launcher/OptiShareLauncher.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o windows/publish
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $exe = 'windows/publish/OptiShare-Companion.exe'
          if (-not (Test-Path $exe)) { throw 'Windows companion EXE was not produced' }
          if ((Get-Item $exe).Length -lt 1000000) { throw 'Windows companion EXE looks unexpectedly small' }
          Get-FileHash $exe -Algorithm SHA256 | Format-List

      - name: Package Windows companion
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path windows/release | Out-Null
          Copy-Item windows/publish/OptiShare-Companion.exe windows/release/OptiShare-2.2-Windows-Companion.exe
          Copy-Item windows/README.md windows/release/README.md
          $hash = (Get-FileHash windows/release/OptiShare-2.2-Windows-Companion.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content windows/release/SHA256SUMS.txt "$hash  OptiShare-2.2-Windows-Companion.exe"
          Compress-Archive -Path windows/release/* -DestinationPath OptiShare-2.2-Windows-Companion.zip -Force

      - name: Upload Windows companion EXE
        uses: actions/upload-artifact@v4
        with:
          name: OptiShare-2.2-Windows-Companion-EXE
          path: |
            windows/release/OptiShare-2.2-Windows-Companion.exe
            windows/release/SHA256SUMS.txt
            windows/release/README.md
          if-no-files-found: error
          retention-days: 30

      - name: Upload Windows companion package
        uses: actions/upload-artifact@v4
        with:
          name: OptiShare-2.2-Windows-Companion
          path: OptiShare-2.2-Windows-Companion.zip
          if-no-files-found: error
          retention-days: 30
