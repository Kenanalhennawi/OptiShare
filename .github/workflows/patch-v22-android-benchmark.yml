name: Integrate OptiShare Android Speed Test

on:
  push:
    branches:
      - feature/v2.2-fast-transfer

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout latest branch
        uses: actions/checkout@v4
        with:
          ref: feature/v2.2-fast-transfer
          fetch-depth: 0

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Apply Android benchmark patch
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/patch_v22_android_benchmark.py
          git diff --check

      - name: Verify encrypted speed test integration
        run: gradle --no-daemon --stacktrace testDebugUnitTest testReleaseUnitTest lintDebug lintRelease assembleDebug

      - name: Commit verified integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/kenan/optishare/protocol/SessionWire.java \
                  app/src/main/java/com/kenan/optishare/transfer/TransferEngine.java \
                  app/src/main/java/com/kenan/optishare/transfer/TransferService.java \
                  app/src/main/java/com/kenan/optishare/V2Activity.java \
                  app/src/test/java/com/kenan/optishare/protocol/SessionWireTest.java
          git commit -m "feat: add encrypted Android speed test"
          git pull --rebase origin feature/v2.2-fast-transfer
          git push origin HEAD:feature/v2.2-fast-transfer
