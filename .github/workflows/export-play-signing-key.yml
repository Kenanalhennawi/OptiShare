name: Temporary Play signing key export

on:
  push:
    branches:
      - feature/v2.2-fast-transfer
    paths:
      - .github/workflows/export-play-signing-key.yml
      - .github/play-signing/encryption_public_key.pem

permissions:
  contents: read

jobs:
  export-encrypted-key:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OPTISHARE_KEYSTORE_B64: ${{ secrets.OPTISHARE_KEYSTORE_B64 }}
      OPTISHARE_STORE_PASSWORD: ${{ secrets.OPTISHARE_STORE_PASSWORD }}
      OPTISHARE_KEY_ALIAS: ${{ secrets.OPTISHARE_KEY_ALIAS }}
      OPTISHARE_KEY_PASSWORD: ${{ secrets.OPTISHARE_KEY_PASSWORD }}
      EXPECTED_CERT_SHA256: C4:08:EC:09:BD:FA:5B:61:86:59:1A:1B:EA:FA:33:33:23:F8:FC:5F:20:5B:41:81:16:12:9B:D3:F9:0F:60:E3
      EXPECTED_PEPK_SHA256: aaccc0774b240aa5304bdad2a49865e92f229ca73209ecb6eaafe75dc858e24e
    steps:
      - uses: actions/checkout@v4

      - name: Validate required secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$OPTISHARE_KEYSTORE_B64"
          test -n "$OPTISHARE_STORE_PASSWORD"
          test -n "$OPTISHARE_KEY_ALIAS"
          test -n "$OPTISHARE_KEY_PASSWORD"

      - name: Restore and verify original signing key
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$OPTISHARE_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/optishare-release.jks"
          actual="$(keytool -list -v -keystore "$RUNNER_TEMP/optishare-release.jks" -storepass "$OPTISHARE_STORE_PASSWORD" -alias "$OPTISHARE_KEY_ALIAS" | sed -n 's/^[[:space:]]*SHA256: //p' | head -n 1)"
          test "$actual" = "$EXPECTED_CERT_SHA256" || { echo "::error::Signing certificate mismatch; refusing export."; exit 1; }
          echo "Original OptiShare signing certificate verified."

      - name: Download and verify Google PEPK
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2             https://www.gstatic.com/play-apps-publisher-rapid/signing-tool/prod/pepk.jar             --output "$RUNNER_TEMP/pepk.jar"
          echo "$EXPECTED_PEPK_SHA256  $RUNNER_TEMP/pepk.jar" | sha256sum --check -

      - name: Export key encrypted for Google Play
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          java -jar "$RUNNER_TEMP/pepk.jar"             --keystore="$RUNNER_TEMP/optishare-release.jks"             --alias="$OPTISHARE_KEY_ALIAS"             --output="$RUNNER_TEMP/optishare-play-signing-key.zip"             --include-cert             --rsa-aes-encryption             --encryption-key-path="$GITHUB_WORKSPACE/.github/play-signing/encryption_public_key.pem"             --keystore-pass="$OPTISHARE_STORE_PASSWORD"             --key-pass="$OPTISHARE_KEY_PASSWORD"
          unzip -t "$RUNNER_TEMP/optishare-play-signing-key.zip"
          test "$(unzip -Z1 "$RUNNER_TEMP/optishare-play-signing-key.zip" | wc -l)" -ge 2
          sha256sum "$RUNNER_TEMP/optishare-play-signing-key.zip" | sed "s|$RUNNER_TEMP/||" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Google-encrypted key package
        uses: actions/upload-artifact@v4
        with:
          name: OptiShare-Google-Play-encrypted-signing-key
          path: ${{ runner.temp }}/optishare-play-signing-key.zip
          if-no-files-found: error
          retention-days: 1

      - name: Remove sensitive runner files
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/optishare-release.jks" "$RUNNER_TEMP/pepk.jar"
