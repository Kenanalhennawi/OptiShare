name: Android 6 Compatibility Smoke

on:
  push:
    branches:
      - feature/v2.2-fast-transfer
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android6-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-6-smoke:
    name: Android 6 / API 23 smoke
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Verify Android 6 support declaration
        shell: bash
        run: |
          set -euo pipefail
          MIN_SDK=$(awk '/minSdk[[:space:]]+[0-9]+/ { print $2; exit }' app/build.gradle)
          test -n "$MIN_SDK" || { echo '::error::Could not read minSdk'; exit 1; }
          if [ "$MIN_SDK" -gt 23 ]; then
            echo "::error::minSdk=$MIN_SDK excludes Android 6 / API 23"
            exit 1
          fi
          echo "minSdk=$MIN_SDK supports Android 6 / API 23"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build, install and run tests on Android 6
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 23
          arch: x86
          target: default
          profile: Nexus 5
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            gradle --no-daemon --stacktrace assembleDebug
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell am force-stop com.kenan.optishare.debug || true
            adb shell monkey -p com.kenan.optishare.debug -c android.intent.category.LAUNCHER 1
            sleep 5
            adb shell pidof com.kenan.optishare.debug >/dev/null || {
              echo '::error::OptiShare did not stay running on Android 6 / API 23'
              adb logcat -d -t 300
              exit 1
            }
            gradle --no-daemon --stacktrace connectedDebugAndroidTest

      - name: Upload Android 6 test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OptiShare-Android6-API23-reports
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: ignore
          retention-days: 14
