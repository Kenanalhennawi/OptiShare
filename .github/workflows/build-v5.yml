name: Build OptiShare V5

on:
  push:
    branches:
      - rebuild/v5-worldclass
  pull_request:
    branches:
      - rebuild/v5-worldclass
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-v5-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: V5 Debug Build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Run V5 quality build
        run: gradle --no-daemon --stacktrace clean testDebugUnitTest lintDebug assembleDebug

      - name: Upload V5 debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: OptiShare-V5-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OptiShare-V5-lint
          path: app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OptiShare-V5-tests
          path: app/build/reports/tests/testDebugUnitTest/**
          if-no-files-found: ignore
          retention-days: 14
