name: Cleanup OptiShare 2.2 Temporary Development Files

on:
  push:
    branches:
      - feature/v2.2-fast-transfer

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/v2.2-fast-transfer
          fetch-depth: 0

      - name: Remove temporary patch workflows and scripts
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(.github/workflows/patch-v22-*.yml tools/patch_v22_*.py .github/workflows/cleanup-v22-temp.yml)
          test ${#files[@]} -gt 0
          git rm -f -- "${files[@]}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: remove temporary v2.2 development workflows"
          git push origin HEAD:feature/v2.2-fast-transfer
