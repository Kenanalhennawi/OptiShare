name: Fix Resumed Transfer Metrics

on:
  push:
    branches:
      - feature/v2.2-fast-transfer

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout latest branch
        uses: actions/checkout@v4
        with:
          ref: feature/v2.2-fast-transfer
          fetch-depth: 0
      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Apply resume metrics fix
        run: python tools/patch_resume_metrics.py
      - name: Verify resume metrics fix
        run: |
          git diff --check
          gradle --no-daemon --stacktrace testDebugUnitTest testReleaseUnitTest lintDebug lintRelease assembleDebug
      - name: Commit verified fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/kenan/optishare/transfer/SenderSessionStore.java app/src/main/java/com/kenan/optishare/transfer/TransferService.java
          git commit -m "fix: accumulate transfer time across resume"
          git push origin HEAD:feature/v2.2-fast-transfer
