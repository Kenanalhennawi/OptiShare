name: Patch OptiShare 2.2 Pause Resume

on:
  push:
    branches: ['feature/v2.2-fast-transfer']
    paths: ['.github/workflows/patch-v22-pause-resume.yml']

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v2.2-fast-transfer
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Add resumable manual pause
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # Persist SmartRoute identity with pending sender session.
          p=Path('app/src/main/java/com/kenan/optishare/transfer/SenderSessionStore.java')
          s=p.read_text()
          s=s.replace('''        public final String peerAddress;\n        public final List<TransferItem> items;''','''        public final String peerAddress;\n        public final String route;\n        public final List<TransferItem> items;''',1)
          s=s.replace('''        Pending(String host, String peerAddress, List<TransferItem> items,\n                BatchManifest manifest) {\n            this.host = host;\n            this.peerAddress = peerAddress;\n            this.items = items;''','''        Pending(String host, String peerAddress, String route, List<TransferItem> items,\n                BatchManifest manifest) {\n            this.host = host;\n            this.peerAddress = peerAddress;\n            this.route = route;\n            this.items = items;''',1)
          s=s.replace('''        save(host, null, items, manifest);''','''        save(host, null, RoutePerformanceStore.ROUTE_DIRECT, items, manifest);''',1)
          old='''    public synchronized void save(String host, String peerAddress,\n                                  List<TransferItem> items,\n                                  BatchManifest manifest) throws Exception {'''
          new='''    public synchronized void save(String host, String peerAddress,\n                                  List<TransferItem> items,\n                                  BatchManifest manifest) throws Exception {\n        save(host, peerAddress, RoutePerformanceStore.ROUTE_DIRECT, items, manifest);\n    }\n\n    public synchronized void save(String host, String peerAddress, String route,\n                                  List<TransferItem> items,\n                                  BatchManifest manifest) throws Exception {'''
          if old not in s: raise RuntimeError('sender save anchor missing')
          s=s.replace(old,new,1)
          s=s.replace('''        root.put("peerAddress", peerAddress == null ? JSONObject.NULL : peerAddress);\n        root.put("sessionId", manifest.getSessionId());''','''        root.put("peerAddress", peerAddress == null ? JSONObject.NULL : peerAddress);\n        root.put("route", RoutePerformanceStore.ROUTE_LAN.equals(route) ? RoutePerformanceStore.ROUTE_LAN : RoutePerformanceStore.ROUTE_DIRECT);\n        root.put("sessionId", manifest.getSessionId());''',1)
          s=s.replace('''            String sessionId = root.getString("sessionId");''','''            String route = root.optString("route", RoutePerformanceStore.ROUTE_DIRECT);\n            if (!RoutePerformanceStore.ROUTE_LAN.equals(route)) route = RoutePerformanceStore.ROUTE_DIRECT;\n            String sessionId = root.getString("sessionId");''',1)
          s=s.replace('''            return new Pending(host, peerAddress, items,\n                    new BatchManifest(sessionId, createdAt, entries));''','''            return new Pending(host, peerAddress, route, items,\n                    new BatchManifest(sessionId, createdAt, entries));''',1)
          p.write_text(s)

          # Foreground service: pause outgoing transfer without clearing resumable session.
          p=Path('app/src/main/java/com/kenan/optishare/transfer/TransferService.java')
          s=p.read_text()
          s=s.replace('''    public static final String ACTION_STOP = "com.kenan.optishare.action.STOP";''','''    public static final String ACTION_STOP = "com.kenan.optishare.action.STOP";\n    public static final String ACTION_PAUSE = "com.kenan.optishare.action.PAUSE";''',1)
          anchor='''        if (ACTION_STOP.equals(action)) {'''
          pause='''        if (ACTION_PAUSE.equals(action)) {\n            pauseOutgoingTransfer();\n            return START_NOT_STICKY;\n        }\n'''
          if anchor not in s: raise RuntimeError('pause action anchor')
          s=s.replace(anchor,pause+anchor,1)
          # Save chosen route in all new/recovered session snapshots.
          s=s.replace('senderStore.save(host, peerAddress, activeItems, activeManifest);','senderStore.save(host, peerAddress, currentRoute, activeItems, activeManifest);')
          # Restore route before resuming persisted transfer.
          old='''        if (!running.compareAndSet(false, true)) return;\n        resetMetrics();\n        executor.execute(() -> {\n            try {\n                activeItems = pending.items;'''
          new='''        if (!running.compareAndSet(false, true)) return;\n        currentRoute = RoutePerformanceStore.ROUTE_LAN.equals(pending.route)\n                ? RoutePerformanceStore.ROUTE_LAN : RoutePerformanceStore.ROUTE_DIRECT;\n        resetMetrics();\n        executor.execute(() -> {\n            try {\n                activeItems = pending.items;'''
          if old not in s: raise RuntimeError('pending sender anchor')
          s=s.replace(old,new,1)
          anchor='''    private void stopTransfer(boolean userCancelled) {'''
          method='''    private void pauseOutgoingTransfer() {\n        if (!running.get() || activeManifest == null || activeItems == null) {\n            broadcast("pause_unavailable", "Pause is available after an outgoing transfer starts", 0, 0,\n                    activeManifest == null ? null : activeManifest.getSessionId());\n            return;\n        }\n        if (latestBatchDone <= 0L) {\n            broadcast("pause_unavailable", "Secure setup is still finishing — pause will be available once file data starts", 0, 0,\n                    activeManifest.getSessionId());\n            return;\n        }\n        int p = percent(latestBatchDone, activeManifest.totalBytes());\n        running.set(false);\n        closeSocket();\n        broadcast("paused", "Paused safely • confirmed progress kept for resume", p, latestSpeed,\n                activeManifest.getSessionId());\n        updateNotification("Transfer paused", "Open OptiShare and tap Resume", p, false);\n        stopForeground(false);\n        stopSelf();\n    }\n\n'''
          if anchor not in s: raise RuntimeError('stopTransfer anchor')
          s=s.replace(anchor,method+anchor,1)
          p.write_text(s)

          # Activity: pause/resume control and persistent resume card on Home.
          p=Path('app/src/main/java/com/kenan/optishare/V2Activity.java')
          s=p.read_text()
          s=s.replace('import com.kenan.optishare.transfer.RoutePerformanceStore;\n','import com.kenan.optishare.transfer.RoutePerformanceStore;\nimport com.kenan.optishare.transfer.SenderSessionStore;\n',1)
          s=s.replace('''    private ProgressBar transferProgress;''','''    private ProgressBar transferProgress;\n    private Button transferPauseButton;\n    private boolean transferPaused;''',1)
          s=s.replace('''    private RoutePerformanceStore routeStore;\n    private LanDiscovery lanDiscovery;''','''    private RoutePerformanceStore routeStore;\n    private SenderSessionStore senderSessionStore;\n    private LanDiscovery lanDiscovery;''',1)
          s=s.replace('''        routeStore = new RoutePerformanceStore(this);\n        lanDiscovery = new LanDiscovery(this);''','''        routeStore = new RoutePerformanceStore(this);\n        senderSessionStore = new SenderSessionStore(this);\n        lanDiscovery = new LanDiscovery(this);''',1)
          # State events.
          old='''            } else if ("progress".equals(event)) {\n                setTransferUi(receiverMode ? "Receiving…" : "Sending…", message, progress);\n                setTransferMetrics(progress, done, total, speed, etaSeconds);'''
          new='''            } else if ("progress".equals(event)) {\n                transferPaused=false;\n                updatePauseButton(false);\n                setTransferUi(receiverMode ? "Receiving…" : "Sending…", message, progress);\n                setTransferMetrics(progress, done, total, speed, etaSeconds);\n            } else if ("paused".equals(event)) {\n                transferPaused=true;\n                setConnectionUi("PAUSED", Color.rgb(255,188,70));\n                setTransferUi("Transfer paused", message, progress);\n                updatePauseButton(true);\n            } else if ("pause_unavailable".equals(event)) {\n                setTransferUi("Finishing secure setup", message, -1);'''
          if old not in s: raise RuntimeError('progress event anchor')
          s=s.replace(old,new,1)
          s=s.replace('''                transferStarted = false;\n            } else if ("error".equals(event)) {''','''                transferStarted = false;\n                transferPaused=false;\n                updatePauseButton(false);\n            } else if ("error".equals(event)) {''',1)
          # Home resume card immediately after send/receive actions.
          anchor='''        root.addView(actions,actionsLp);'''
          home='''        root.addView(actions,actionsLp);\n\n        if(senderSessionStore.exists()){\n            LinearLayout resumeCard=card();\n            resumeCard.addView(text("Pending transfer",15,Color.WHITE,true));\n            resumeCard.addView(text("Confirmed progress is saved. Resume from the last verified chunk instead of starting over.",12,Color.rgb(158,188,211),false));\n            Button resume=primary("Resume pending transfer →");resume.setOnClickListener(v->resumePendingTransfer());\n            LinearLayout.LayoutParams rp=new LinearLayout.LayoutParams(-1,dp(50));rp.setMargins(0,dp(10),0,0);resumeCard.addView(resume,rp);\n            LinearLayout.LayoutParams rcp=new LinearLayout.LayoutParams(-1,-2);rcp.setMargins(0,dp(14),0,0);root.addView(resumeCard,rcp);\n        }'''
          if anchor not in s: raise RuntimeError('home action anchor')
          s=s.replace(anchor,home,1)
          # Pause button on sender transfer screen before cancel.
          anchor='''        card.addView(metrics);root.addView(card);\n        Button cancel=secondaryButton("Cancel transfer");'''
          buttons='''        card.addView(metrics);root.addView(card);\n        if(!receiverMode){\n            transferPauseButton=secondaryButton("Pause transfer");\n            transferPauseButton.setOnClickListener(v->pauseOrResumeTransfer());\n            LinearLayout.LayoutParams pbtn=new LinearLayout.LayoutParams(-1,dp(50));pbtn.setMargins(0,dp(12),0,0);root.addView(transferPauseButton,pbtn);\n        }else transferPauseButton=null;\n        Button cancel=secondaryButton("Cancel transfer");'''
          if anchor not in s: raise RuntimeError('transfer button anchor')
          s=s.replace(anchor,buttons,1)
          # Methods before stop service.
          anchor='''    private void stopTransferService(){'''
          methods='''    private void pauseOrResumeTransfer(){\n        if(transferPaused){resumePendingTransfer();return;}\n        startService(new Intent(this,TransferService.class).setAction(TransferService.ACTION_PAUSE));\n    }\n\n    private void resumePendingTransfer(){\n        if(!senderSessionStore.exists()){showMessage("Resume transfer","No pending outgoing transfer was found.");return;}\n        receiverMode=false;transferPaused=false;transferStarted=true;\n        showTransferScreen("Resuming");\n        setConnectionUi("RESUMING…",Color.rgb(255,188,70));\n        setTransferUi("Restoring transfer","Connecting and requesting the receiver's verified resume offsets…",-1);\n        Intent i=new Intent(this,TransferService.class).setAction(TransferService.ACTION_RESUME_PENDING);\n        ContextCompat.startForegroundService(this,i);\n    }\n\n    private void updatePauseButton(boolean paused){runOnUiThread(()->{if(transferPauseButton==null)return;transferPauseButton.setText(paused?"Resume transfer":"Pause transfer");transferPauseButton.setOnClickListener(v->pauseOrResumeTransfer());});}\n\n'''
          if anchor not in s: raise RuntimeError('stop service anchor')
          s=s.replace(anchor,methods+anchor,1)
          p.write_text(s)
          PY
          git diff --check
          git diff --stat

      - name: Compile lint and test
        run: gradle --no-daemon --stacktrace testDebugUnitTest testReleaseUnitTest lintDebug lintRelease assembleDebug

      - name: Commit verified pause resume
        shell: bash
        run: |
          git config user.name "Kenanalhennawi"
          git config user.email "135068266+Kenanalhennawi@users.noreply.github.com"
          git add app/src/main/java/com/kenan/optishare/transfer/SenderSessionStore.java app/src/main/java/com/kenan/optishare/transfer/TransferService.java app/src/main/java/com/kenan/optishare/V2Activity.java
          git commit -m "feat: add true resumable pause and resume"
          git fetch origin feature/v2.2-fast-transfer
          git rebase origin/feature/v2.2-fast-transfer
          git push origin HEAD:feature/v2.2-fast-transfer
