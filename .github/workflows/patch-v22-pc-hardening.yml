name: Harden OptiShare Windows PC Route

on:
  push:
    branches:
      - feature/v2.2-fast-transfer

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest branch
        uses: actions/checkout@v4
        with:
          ref: feature/v2.2-fast-transfer
          fetch-depth: 0

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Apply PC hardening
        shell: bash
        run: |
          set -euo pipefail
          if grep -q 'Could not determine file size for Windows transfer' app/src/main/java/com/kenan/optishare/transfer/PcTransferService.java; then
            echo 'PC hardening already present.'
          else
            python3 tools/patch_v22_pc_hardening.py
          fi
          git diff --check

      - name: Verify hardened route
        run: gradle --no-daemon --stacktrace testDebugUnitTest testReleaseUnitTest lintDebug lintRelease assembleDebug

      - name: Commit verified hardening
        shell: bash
        run: |
          set -euo pipefail
          git add app/src/main/java/com/kenan/optishare/transfer/PcTransferService.java
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: harden Android to Windows file streams"
          git pull --rebase origin feature/v2.2-fast-transfer
          git push origin HEAD:feature/v2.2-fast-transfer
