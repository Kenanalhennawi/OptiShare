name: OptiShare V5 FINAL SIGNED APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/optishare-v5-release-final.yml'

permissions:
  contents: read

jobs:
  signed-release:
    name: Build FINAL Signed V5 APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout V5 branch
        uses: actions/checkout@v4
        with:
          ref: rebuild/v5-worldclass

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Validate signing secrets
        env:
          ENCRYPTION_PASSWORD: ${{ secrets.OPTISHARE_KEYSTORE_ENCRYPTION_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.OPTISHARE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.OPTISHARE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.OPTISHARE_KEY_PASSWORD }}
        run: |
          test -n "$ENCRYPTION_PASSWORD" || { echo '::error::Missing OPTISHARE_KEYSTORE_ENCRYPTION_PASSWORD'; exit 1; }
          test -n "$STORE_PASSWORD" || { echo '::error::Missing OPTISHARE_STORE_PASSWORD'; exit 1; }
          test -n "$KEY_ALIAS" || { echo '::error::Missing OPTISHARE_KEY_ALIAS'; exit 1; }
          test -n "$KEY_PASSWORD" || { echo '::error::Missing OPTISHARE_KEY_PASSWORD'; exit 1; }
          test -s .github/signing/optishare-release.jks.enc.b64 || { echo '::error::Encrypted release keystore payload missing'; exit 1; }

      - name: Restore encrypted signing keystore
        env:
          ENCRYPTION_PASSWORD: ${{ secrets.OPTISHARE_KEYSTORE_ENCRYPTION_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.OPTISHARE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.OPTISHARE_KEY_ALIAS }}
        run: |
          base64 --decode .github/signing/optishare-release.jks.enc.b64 > "$RUNNER_TEMP/optishare-release.jks.enc"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
            -in "$RUNNER_TEMP/optishare-release.jks.enc" \
            -out "$RUNNER_TEMP/optishare-release.jks" \
            -pass env:ENCRYPTION_PASSWORD
          chmod 600 "$RUNNER_TEMP/optishare-release.jks"
          keytool -list \
            -keystore "$RUNNER_TEMP/optishare-release.jks" \
            -storepass "$STORE_PASSWORD" \
            -alias "$KEY_ALIAS" >/dev/null

      - name: Build true signed Release APK
        env:
          STORE_PASSWORD: ${{ secrets.OPTISHARE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.OPTISHARE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.OPTISHARE_KEY_PASSWORD }}
        run: |
          gradle --no-daemon --stacktrace \
            -POPTISHARE_STORE_FILE="$RUNNER_TEMP/optishare-release.jks" \
            -POPTISHARE_STORE_PASSWORD="$STORE_PASSWORD" \
            -POPTISHARE_KEY_ALIAS="$KEY_ALIAS" \
            -POPTISHARE_KEY_PASSWORD="$KEY_PASSWORD" \
            clean testReleaseUnitTest lintRelease assembleRelease

      - name: Verify Release signature
        run: |
          APK=$(find app/build/outputs/apk/release -name '*.apk' -type f | head -n 1)
          test -n "$APK" || { echo '::error::Release APK not found'; exit 1; }
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          mkdir -p release-output
          cp "$APK" release-output/OptiShare-V5-FINAL-SIGNED.apk

      - name: Upload FINAL signed APK
        uses: actions/upload-artifact@v4
        with:
          name: OptiShare-V5-FINAL-SIGNED-APK
          path: release-output/OptiShare-V5-FINAL-SIGNED.apk
          if-no-files-found: error
          retention-days: 30

