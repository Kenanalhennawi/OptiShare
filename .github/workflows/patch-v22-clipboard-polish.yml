name: Polish OptiShare Clipboard UX

on:
  push:
    branches:
      - feature/v2.2-fast-transfer

permissions:
  contents: write

jobs:
  polish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout latest branch
        uses: actions/checkout@v4
        with:
          ref: feature/v2.2-fast-transfer
          fetch-depth: 0

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Apply polish
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/patch_v22_clipboard_polish.py
          git diff --check

      - name: Verify Android
        run: gradle --no-daemon --stacktrace testDebugUnitTest testReleaseUnitTest lintDebug lintRelease assembleDebug

      - name: Validate PowerShell syntax
        shell: pwsh
        run: |
          $tokens=$null; $errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'windows/OptiShare-Companion.ps1'),[ref]$tokens,[ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Error $_.Message }; exit 1 }

      - name: Commit verified polish
        shell: bash
        run: |
          set -euo pipefail
          git add app/src/main/java/com/kenan/optishare/V2Activity.java windows/OptiShare-Companion.ps1
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "polish: show clipboard and benchmark status"
          git pull --rebase origin feature/v2.2-fast-transfer
          git push origin HEAD:feature/v2.2-fast-transfer
