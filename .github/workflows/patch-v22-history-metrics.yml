name: Patch OptiShare 2.2 History Metrics

on:
  push:
    branches: ['feature/v2.2-fast-transfer']
    paths: ['.github/workflows/patch-v22-history-metrics.yml']

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v2.2-fast-transfer
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Add structured completion metrics and rich history
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # Backward-compatible richer history model.
          p=Path('app/src/main/java/com/kenan/optishare/history/TransferHistoryStore.java')
          s=p.read_text()
          s=s.replace('''        public final boolean success;\n\n        public Entry(long time, String direction, String peer, int fileCount, long totalBytes, boolean success) {\n            this.time = time;\n            this.direction = direction;\n            this.peer = peer;\n            this.fileCount = fileCount;\n            this.totalBytes = totalBytes;\n            this.success = success;\n        }''','''        public final boolean success;\n        public final long durationMs;\n        public final double averageBytesPerSecond;\n        public final String route;\n        public final int reconnects;\n\n        public Entry(long time, String direction, String peer, int fileCount, long totalBytes, boolean success) {\n            this(time, direction, peer, fileCount, totalBytes, success, 0L, 0d, "unknown", 0);\n        }\n\n        public Entry(long time, String direction, String peer, int fileCount, long totalBytes, boolean success,\n                     long durationMs, double averageBytesPerSecond, String route, int reconnects) {\n            this.time = time;\n            this.direction = direction;\n            this.peer = peer;\n            this.fileCount = fileCount;\n            this.totalBytes = totalBytes;\n            this.success = success;\n            this.durationMs = Math.max(0L, durationMs);\n            this.averageBytesPerSecond = Math.max(0d, averageBytesPerSecond);\n            this.route = route == null || route.trim().isEmpty() ? "unknown" : route;\n            this.reconnects = Math.max(0, reconnects);\n        }''',1)
          s=s.replace('''                o.put("success", e.success);\n                array.put(o);''','''                o.put("success", e.success);\n                o.put("durationMs", e.durationMs);\n                o.put("averageBytesPerSecond", e.averageBytesPerSecond);\n                o.put("route", e.route);\n                o.put("reconnects", e.reconnects);\n                array.put(o);''',1)
          old='''                        o.optLong("totalBytes", 0),\n                        o.optBoolean("success", false)));'''
          new='''                        o.optLong("totalBytes", 0),\n                        o.optBoolean("success", false),\n                        o.optLong("durationMs", 0),\n                        o.optDouble("averageBytesPerSecond", 0d),\n                        o.optString("route", "unknown"),\n                        o.optInt("reconnects", 0)));'''
          if old not in s: raise RuntimeError('history load anchor missing')
          s=s.replace(old,new,1)
          p.write_text(s)

          # TransferService broadcasts structured completion metrics.
          p=Path('app/src/main/java/com/kenan/optishare/transfer/TransferService.java')
          s=p.read_text()
          marker='''    public static final String EXTRA_ETA_SECONDS = "eta_seconds";'''
          addition='''    public static final String EXTRA_ETA_SECONDS = "eta_seconds";\n    public static final String EXTRA_AVG_SPEED = "avg_speed";\n    public static final String EXTRA_DURATION_MS = "duration_ms";\n    public static final String EXTRA_RECONNECTS = "reconnects";\n    public static final String EXTRA_FILE_COUNT = "file_count";\n    public static final String EXTRA_TOTAL_BYTES = "total_bytes";'''
          if marker not in s: raise RuntimeError('service extras anchor missing')
          s=s.replace(marker,addition,1)

          # Receiver completion.
          old='''            @Override public void onCompleted(String sessionId) {\n                String summary = benchmarkSummary("Received");\n                updateNotification("Transfer complete", summary, 100, false);\n                broadcast("completed", summary, 100, 0, sessionId);\n            }'''
          new='''            @Override public void onCompleted(String sessionId) {\n                String summary = benchmarkSummary("Received");\n                updateNotification("Transfer complete", summary, 100, false);\n                broadcastCompleted(summary, sessionId, "incoming");\n            }'''
          if old not in s: raise RuntimeError('receiver completed anchor missing')
          s=s.replace(old,new,1)

          # Sender completion, preserving SmartRoute learning.
          old='''            @Override public void onCompleted(String sessionId) {\n                routeStore.recordSuccess(currentRoute, averageBytesPerSecond());\n                String summary = benchmarkSummary("Sent") + " • " + routeLabel(currentRoute);\n                updateNotification("Transfer complete", summary, 100, false);\n                broadcast("completed", summary, 100, 0, sessionId);\n            }'''
          new='''            @Override public void onCompleted(String sessionId) {\n                routeStore.recordSuccess(currentRoute, averageBytesPerSecond());\n                String summary = benchmarkSummary("Sent") + " • " + routeLabel(currentRoute);\n                updateNotification("Transfer complete", summary, 100, false);\n                broadcastCompleted(summary, sessionId, currentRoute);\n            }'''
          if old not in s: raise RuntimeError('sender completed anchor missing')
          s=s.replace(old,new,1)

          # Structured completion method before progress broadcast.
          anchor='''    private void broadcastProgress(String message, int progress, double speed, String session,'''
          method='''    private void broadcastCompleted(String message, String session, String route) {\n        long total = activeManifest == null ? latestBatchDone : activeManifest.totalBytes();\n        int fileCount = activeManifest == null ? 0 : activeManifest.getEntries().size();\n        double average = averageBytesPerSecond();\n        long durationMs = activeTransferStartedNanos == 0L ? 0L\n                : Math.max(0L, Math.round((System.nanoTime() - activeTransferStartedNanos) / 1_000_000.0));\n        Intent intent = new Intent(ACTION_EVENT);\n        intent.setPackage(getPackageName());\n        intent.putExtra(EXTRA_EVENT, "completed");\n        intent.putExtra(EXTRA_MESSAGE, message);\n        intent.putExtra(EXTRA_PROGRESS, 100);\n        intent.putExtra(EXTRA_SESSION, session);\n        intent.putExtra(EXTRA_ROUTE, route == null ? "unknown" : route);\n        intent.putExtra(EXTRA_AVG_SPEED, average);\n        intent.putExtra(EXTRA_DURATION_MS, durationMs);\n        intent.putExtra(EXTRA_RECONNECTS, reconnectCount);\n        intent.putExtra(EXTRA_FILE_COUNT, fileCount);\n        intent.putExtra(EXTRA_TOTAL_BYTES, total);\n        sendBroadcast(intent);\n    }\n\n'''
          if anchor not in s: raise RuntimeError('broadcastProgress anchor missing')
          s=s.replace(anchor,method+anchor,1)
          p.write_text(s)

          # V2Activity consumes structured metrics and presents useful recent history.
          p=Path('app/src/main/java/com/kenan/optishare/V2Activity.java')
          s=p.read_text()
          old='''            long etaSeconds = intent.getLongExtra(TransferService.EXTRA_ETA_SECONDS, 0L);\n            if (event == null) return;'''
          new='''            long etaSeconds = intent.getLongExtra(TransferService.EXTRA_ETA_SECONDS, 0L);\n            double averageSpeed = intent.getDoubleExtra(TransferService.EXTRA_AVG_SPEED, 0d);\n            long durationMs = intent.getLongExtra(TransferService.EXTRA_DURATION_MS, 0L);\n            int reconnects = intent.getIntExtra(TransferService.EXTRA_RECONNECTS, 0);\n            int completedFileCount = intent.getIntExtra(TransferService.EXTRA_FILE_COUNT, 0);\n            long completedTotalBytes = intent.getLongExtra(TransferService.EXTRA_TOTAL_BYTES, 0L);\n            String completedRoute = intent.getStringExtra(TransferService.EXTRA_ROUTE);\n            if (event == null) return;'''
          if old not in s: raise RuntimeError('activity metrics extras anchor missing')
          s=s.replace(old,new,1)
          old='''                historyStore.add(new TransferHistoryStore.Entry(\n                        System.currentTimeMillis(), receiverMode ? "received" : "sent",\n                        connectedPeerName, selected.size(), selectedTotalBytes(), true));'''
          new='''                historyStore.add(new TransferHistoryStore.Entry(\n                        System.currentTimeMillis(), receiverMode ? "received" : "sent",\n                        connectedPeerName, completedFileCount > 0 ? completedFileCount : selected.size(),\n                        completedTotalBytes > 0 ? completedTotalBytes : selectedTotalBytes(), true,\n                        durationMs, averageSpeed, completedRoute, reconnects));'''
          if old not in s: raise RuntimeError('activity success history anchor missing')
          s=s.replace(old,new,1)

          # Rich recent history second line.
          old='''                card.addView(text(DateFormat.getDateTimeInstance(DateFormat.SHORT,DateFormat.SHORT).format(new Date(e.time)),11,Color.rgb(133,162,187),false));'''
          new='''                StringBuilder meta=new StringBuilder();\n                meta.append(DateFormat.getDateTimeInstance(DateFormat.SHORT,DateFormat.SHORT).format(new Date(e.time)));\n                if(e.totalBytes>0)meta.append(" • ").append(formatBytes(e.totalBytes));\n                if(e.averageBytesPerSecond>0)meta.append(" • avg ").append(formatTransferSpeed(e.averageBytesPerSecond));\n                if(e.durationMs>0)meta.append(" • ").append(formatHistoryDuration(e.durationMs));\n                if(!"unknown".equals(e.route))meta.append(" • ").append(historyRouteLabel(e.route));\n                if(e.reconnects>0)meta.append(" • ").append(e.reconnects).append(e.reconnects==1?" reconnect":" reconnects");\n                card.addView(text(meta.toString(),11,Color.rgb(133,162,187),false));'''
          if old not in s: raise RuntimeError('history UI anchor missing')
          s=s.replace(old,new,1)

          # Formatting helpers.
          anchor='''    private String formatTransferSpeed(double bytesPerSecond){'''
          helpers='''    private String formatHistoryDuration(long ms){\n        if(ms<1000)return ms+" ms";\n        long seconds=Math.max(1,Math.round(ms/1000.0));\n        if(seconds<60)return seconds+"s";\n        return (seconds/60)+"m "+(seconds%60)+"s";\n    }\n    private String historyRouteLabel(String route){\n        if(RoutePerformanceStore.ROUTE_DIRECT.equals(route))return "Wi-Fi Direct";\n        if(RoutePerformanceStore.ROUTE_LAN.equals(route))return "same Wi-Fi";\n        if("incoming".equals(route))return "received";\n        return route;\n    }\n\n'''
          if anchor not in s: raise RuntimeError('format helper anchor missing')
          s=s.replace(anchor,helpers+anchor,1)
          p.write_text(s)
          PY
          git diff --check
          git diff --stat

      - name: Compile lint and test
        run: gradle --no-daemon --stacktrace testDebugUnitTest testReleaseUnitTest lintDebug lintRelease assembleDebug

      - name: Commit verified history metrics
        shell: bash
        run: |
          git config user.name "Kenanalhennawi"
          git config user.email "135068266+Kenanalhennawi@users.noreply.github.com"
          git add app/src/main/java/com/kenan/optishare/history/TransferHistoryStore.java app/src/main/java/com/kenan/optishare/transfer/TransferService.java app/src/main/java/com/kenan/optishare/V2Activity.java
          git commit -m "feat: add professional transfer history metrics"
          git fetch origin feature/v2.2-fast-transfer
          git rebase origin/feature/v2.2-fast-transfer
          git push origin HEAD:feature/v2.2-fast-transfer
