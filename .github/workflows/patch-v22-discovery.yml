name: Patch OptiShare 2.2 Automatic Discovery

on:
  push:
    branches: ['feature/v2.2-fast-transfer']
    paths: ['.github/workflows/patch-v22-discovery.yml']

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v2.2-fast-transfer
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Apply automatic discovery retry patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/java/com/kenan/optishare/V2Activity.java')
          s=p.read_text()

          old='''import android.os.Build;\nimport android.os.Bundle;'''
          new='''import android.os.Build;\nimport android.os.Bundle;\nimport android.os.Handler;\nimport android.os.Looper;'''
          assert old in s, 'imports anchor missing'
          s=s.replace(old,new,1)

          old='''    private DeviceIdentity identity;\n    private TransferHistoryStore historyStore;\n    private long activeTransferStartedAt;'''
          new='''    private DeviceIdentity identity;\n    private TransferHistoryStore historyStore;\n    private long activeTransferStartedAt;\n    private final Handler discoveryHandler = new Handler(Looper.getMainLooper());\n    private int discoveryAttempt;\n    private static final int MAX_DISCOVERY_ATTEMPTS = 8;\n    private static final long DISCOVERY_RETRY_MS = 3500L;\n    private final Runnable discoveryRetry = () -> {\n        if (currentScreen == SCREEN_DISCOVERY && !transferStarted && peers.isEmpty()) {\n            runDiscoveryPass();\n        }\n    };'''
          assert old in s, 'field anchor missing'
          s=s.replace(old,new,1)

          old='''    private void startDiscovery() {\n        if(!ensureNearbyReady())return;peers.clear();renderPeers();setDiscoveryText("Searching for receiving phones…");setConnectionUi("SEARCHING",Color.rgb(255,194,73));\n        try{manager.discoverPeers(channel,new WifiP2pManager.ActionListener(){@Override public void onSuccess(){setDiscoveryText("Searching… receiver must remain on RECEIVE.");try{manager.requestPeers(channel,V2Activity.this);}catch(SecurityException ignored){showNearbyPermissionHelp();}}@Override public void onFailure(int reason){setDiscoveryText(p2pError("Search failed",reason));}});}catch(SecurityException e){showNearbyPermissionHelp();}\n    }'''
          new='''    private void startDiscovery() {\n        if(!ensureNearbyReady())return;\n        discoveryHandler.removeCallbacks(discoveryRetry);\n        discoveryAttempt=0;\n        peers.clear();\n        renderPeers();\n        setConnectionUi("SEARCHING",Color.rgb(255,194,73));\n        runDiscoveryPass();\n    }\n\n    private void runDiscoveryPass() {\n        if(currentScreen!=SCREEN_DISCOVERY||transferStarted||!ensureNearbyReady())return;\n        discoveryAttempt++;\n        setDiscoveryText("Searching for receiving phones… • pass "+discoveryAttempt+"/"+MAX_DISCOVERY_ATTEMPTS);\n        try{\n            manager.discoverPeers(channel,new WifiP2pManager.ActionListener(){\n                @Override public void onSuccess(){\n                    try{manager.requestPeers(channel,V2Activity.this);}catch(SecurityException ignored){showNearbyPermissionHelp();return;}\n                    scheduleDiscoveryRetry();\n                }\n                @Override public void onFailure(int reason){\n                    setDiscoveryText(p2pError("Search pass "+discoveryAttempt+" failed",reason));\n                    scheduleDiscoveryRetry();\n                }\n            });\n        }catch(SecurityException e){showNearbyPermissionHelp();}\n    }\n\n    private void scheduleDiscoveryRetry(){\n        discoveryHandler.removeCallbacks(discoveryRetry);\n        if(currentScreen==SCREEN_DISCOVERY&&!transferStarted&&peers.isEmpty()&&discoveryAttempt<MAX_DISCOVERY_ATTEMPTS){\n            discoveryHandler.postDelayed(discoveryRetry,DISCOVERY_RETRY_MS);\n        }else if(currentScreen==SCREEN_DISCOVERY&&peers.isEmpty()&&discoveryAttempt>=MAX_DISCOVERY_ATTEMPTS){\n            setDiscoveryText("No receiver found yet. Keep RECEIVE open, then tap Search again.");\n        }\n    }'''
          assert old in s, 'startDiscovery anchor missing'
          s=s.replace(old,new,1)

          old='''        renderPeers();if(currentScreen==SCREEN_DISCOVERY)setDiscoveryText(peers.isEmpty()?"No receiver found yet. Keep RECEIVE open on the other phone.":peers.size()+" nearby device"+(peers.size()==1?"":"s")+" found");'''
          new='''        renderPeers();if(currentScreen==SCREEN_DISCOVERY){if(peers.isEmpty()){scheduleDiscoveryRetry();}else{discoveryHandler.removeCallbacks(discoveryRetry);setDiscoveryText(peers.size()+" nearby device"+(peers.size()==1?"":"s")+" found ✓");}}'''
          assert old in s, 'peers anchor missing'
          s=s.replace(old,new,1)

          old='''    private void connectTo(WifiP2pDevice device) {\n        if(!ensureNearbyReady())return;connectedPeerName=deviceName(device);'''
          new='''    private void connectTo(WifiP2pDevice device) {\n        if(!ensureNearbyReady())return;discoveryHandler.removeCallbacks(discoveryRetry);connectedPeerName=deviceName(device);'''
          assert old in s, 'connect anchor missing'
          s=s.replace(old,new,1)

          old='''    @Override protected void onPause(){super.onPause();try{unregisterReceiver(p2pReceiver);}catch(Exception ignored){}try{unregisterReceiver(transferReceiver);}catch(Exception ignored){}}'''
          new='''    @Override protected void onPause(){super.onPause();discoveryHandler.removeCallbacks(discoveryRetry);try{unregisterReceiver(p2pReceiver);}catch(Exception ignored){}try{unregisterReceiver(transferReceiver);}catch(Exception ignored){}}'''
          assert old in s, 'pause anchor missing'
          s=s.replace(old,new,1)

          p.write_text(s)
          PY
          git diff --check
          git diff -- app/src/main/java/com/kenan/optishare/V2Activity.java
      - name: Compile and test discovery patch
        run: gradle --no-daemon --stacktrace testDebugUnitTest testReleaseUnitTest lintDebug assembleDebug
      - name: Commit verified discovery patch
        shell: bash
        run: |
          git config user.name "Kenanalhennawi"
          git config user.email "135068266+Kenanalhennawi@users.noreply.github.com"
          git add app/src/main/java/com/kenan/optishare/V2Activity.java
          git commit -m "ux: automatically retry nearby device discovery"
          git push origin HEAD:feature/v2.2-fast-transfer
