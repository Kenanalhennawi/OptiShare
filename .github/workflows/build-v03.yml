name: Build OptiShare v0.3

on:
  push:
    branches:
      - update/v0.3
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      OPTISHARE_KEYSTORE_B64: ${{ secrets.OPTISHARE_KEYSTORE_B64 }}
      OPTISHARE_STORE_PASSWORD: ${{ secrets.OPTISHARE_STORE_PASSWORD }}
      OPTISHARE_KEY_ALIAS: ${{ secrets.OPTISHARE_KEY_ALIAS }}
      OPTISHARE_KEY_PASSWORD: ${{ secrets.OPTISHARE_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Expand v0.3 source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/v03" "$RUNNER_TEMP/v03.zip"
          mkdir -p "$RUNNER_TEMP/v03"
          test -s v03-source.b64
          base64 --decode v03-source.b64 > "$RUNNER_TEMP/v03.zip"
          unzip -t "$RUNNER_TEMP/v03.zip"
          unzip -q "$RUNNER_TEMP/v03.zip" -d "$RUNNER_TEMP/v03"

      - name: Build v0.3 debug APK
        working-directory: ${{ runner.temp }}/v03
        run: gradle --no-daemon assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: OptiShare-v0.3-debug-apk
          path: ${{ runner.temp }}/v03/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Restore release keystore
        if: ${{ env.OPTISHARE_KEYSTORE_B64 != '' }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$OPTISHARE_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/optishare-release.jks"

      - name: Build signed release APK
        if: ${{ env.OPTISHARE_KEYSTORE_B64 != '' }}
        working-directory: ${{ runner.temp }}/v03
        env:
          ORG_GRADLE_PROJECT_OPTISHARE_STORE_FILE: ${{ runner.temp }}/optishare-release.jks
          ORG_GRADLE_PROJECT_OPTISHARE_STORE_PASSWORD: ${{ env.OPTISHARE_STORE_PASSWORD }}
          ORG_GRADLE_PROJECT_OPTISHARE_KEY_ALIAS: ${{ env.OPTISHARE_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_OPTISHARE_KEY_PASSWORD: ${{ env.OPTISHARE_KEY_PASSWORD }}
        run: gradle --no-daemon assembleRelease

      - name: Upload signed release APK
        if: ${{ env.OPTISHARE_KEYSTORE_B64 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: OptiShare-v0.3-signed-release-apk
          path: ${{ runner.temp }}/v03/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
