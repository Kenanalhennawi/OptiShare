name: Patch OptiShare 2.2 Hotspot Fallback
on:
  push:
    branches:
      - feature/v2.2-fast-transfer
    paths:
      - .github/workflows/patch-v22-hotspot.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v2.2-fast-transfer
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
          cache-read-only: true
      - name: Apply local hotspot fallback
        run: python3 tools/patch_v22_hotspot.py
      - name: Check diff
        run: git diff --check && git status --short
      - name: Compile lint and test
        run: gradle --no-daemon --stacktrace testDebugUnitTest testReleaseUnitTest lintDebug lintRelease assembleDebug
      - name: Commit verified hotspot fallback
        shell: bash
        run: |
          git config user.name "Kenanalhennawi"
          git config user.email "135068266+Kenanalhennawi@users.noreply.github.com"
          git add app/src/main/AndroidManifest.xml app/src/main/java
          git commit -m "feat: add Android local hotspot fallback"
          git fetch origin feature/v2.2-fast-transfer
          git rebase origin/feature/v2.2-fast-transfer
          git push origin HEAD:feature/v2.2-fast-transfer
