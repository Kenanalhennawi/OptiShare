name: Integrate OptiShare Wi-Fi Direct Recovery

on:
  push:
    branches:
      - feature/v2.2-fast-transfer

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout latest branch
        uses: actions/checkout@v4
        with:
          ref: feature/v2.2-fast-transfer
          fetch-depth: 0

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Apply Wi-Fi Direct recovery patch
        run: python tools/patch_v22_p2p_recovery.py

      - name: Verify Wi-Fi Direct recovery
        run: |
          git diff --check
          gradle --no-daemon --stacktrace testDebugUnitTest testReleaseUnitTest lintDebug lintRelease assembleDebug

      - name: Commit verified integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/kenan/optishare/V2Activity.java
          git commit -m "fix: recover stalled Wi-Fi Direct connections"
          git push origin HEAD:feature/v2.2-fast-transfer
