name: Build OptiShare V5 Release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    name: V5 Signed Release Build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Validate signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.OPTISHARE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.OPTISHARE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.OPTISHARE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.OPTISHARE_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo 'Missing OPTISHARE_KEYSTORE_BASE64'; exit 1; }
          test -n "$STORE_PASSWORD" || { echo 'Missing OPTISHARE_STORE_PASSWORD'; exit 1; }
          test -n "$KEY_ALIAS" || { echo 'Missing OPTISHARE_KEY_ALIAS'; exit 1; }
          test -n "$KEY_PASSWORD" || { echo 'Missing OPTISHARE_KEY_PASSWORD'; exit 1; }

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.OPTISHARE_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/optishare-release.jks"
          chmod 600 "$RUNNER_TEMP/optishare-release.jks"

      - name: Build signed release APK
        env:
          STORE_PASSWORD: ${{ secrets.OPTISHARE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.OPTISHARE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.OPTISHARE_KEY_PASSWORD }}
        run: |
          gradle --no-daemon --stacktrace \
            -POPTISHARE_STORE_FILE="$RUNNER_TEMP/optishare-release.jks" \
            -POPTISHARE_STORE_PASSWORD="$STORE_PASSWORD" \
            -POPTISHARE_KEY_ALIAS="$KEY_ALIAS" \
            -POPTISHARE_KEY_PASSWORD="$KEY_PASSWORD" \
            clean testReleaseUnitTest lintRelease assembleRelease

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: OptiShare-V5-release-signed
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload release lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OptiShare-V5-release-lint
          path: app/build/reports/lint-results-release.*
          if-no-files-found: ignore
          retention-days: 14
