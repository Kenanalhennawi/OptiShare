name: Build OptiShare v0.2

on:
  push:
    branches: ['update/v0.2']
  workflow_dispatch:

permissions:
  contents: read

env:
  SIGNING_KEY_B64: ${{ secrets.OPTISHARE_KEYSTORE_B64 }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Rebuild v0.2 source archive
        run: |
          cat v02-source.part1.b64 v02-source.part2.b64 v02-source.part3.b64 > "$RUNNER_TEMP/v02-source.b64"
          base64 --decode "$RUNNER_TEMP/v02-source.b64" > "$RUNNER_TEMP/v02-source.zip"
          unzip -t "$RUNNER_TEMP/v02-source.zip"
          mkdir -p "$RUNNER_TEMP/v02"
          unzip -q "$RUNNER_TEMP/v02-source.zip" -d "$RUNNER_TEMP/v02"

      - name: Build v0.2 debug APK
        working-directory: ${{ runner.temp }}/v02
        run: gradle --no-daemon assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: OptiShare-v0.2-debug-apk
          path: ${{ runner.temp }}/v02/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Decode release keystore
        if: ${{ env.SIGNING_KEY_B64 != '' }}
        run: echo "$SIGNING_KEY_B64" | base64 --decode > "$RUNNER_TEMP/optishare-release.jks"

      - name: Build signed release APK
        if: ${{ env.SIGNING_KEY_B64 != '' }}
        working-directory: ${{ runner.temp }}/v02
        env:
          OPTISHARE_KEYSTORE: ${{ runner.temp }}/optishare-release.jks
          OPTISHARE_STORE_PASSWORD: ${{ secrets.OPTISHARE_STORE_PASSWORD }}
          OPTISHARE_KEY_ALIAS: ${{ secrets.OPTISHARE_KEY_ALIAS }}
          OPTISHARE_KEY_PASSWORD: ${{ secrets.OPTISHARE_KEY_PASSWORD }}
        run: gradle --no-daemon assembleRelease

      - name: Upload signed release APK
        if: ${{ env.SIGNING_KEY_B64 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: OptiShare-v0.2-signed-release-apk
          path: ${{ runner.temp }}/v02/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
