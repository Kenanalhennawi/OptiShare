name: OptiShare Advanced Security

on:
  workflow_dispatch:
  push:
    branches:
      - feature/v2.2-fast-transfer
    paths:
      - 'app/**'
      - '*.gradle'
      - 'gradle.properties'
      - '.github/workflows/**'
  schedule:
    - cron: '23 3 * * 1'

permissions:
  contents: read

concurrency:
  group: optishare-advanced-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    name: CodeQL Java security-extended
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@a35ac6e6798d72df5475948b28efb89edc2e19ca # v4.37.9
        with:
          languages: java-kotlin
          build-mode: none
          queries: security-extended

      - name: Analyze Java data flow
        uses: github/codeql-action/analyze@a35ac6e6798d72df5475948b28efb89edc2e19ca # v4.37.9
        with:
          category: /language:java-kotlin

  osv:
    name: OSV dependency vulnerabilities
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@8deb546fdb875b9996d27d4950be7312dac076a1 # v2.5.0
    permissions:
      contents: read
      actions: read
      security-events: write
    with:
      scan-args: |-
        --recursive
        ./
      fail-on-vuln: true
      upload-sarif: true

  zizmor:
    name: zizmor GitHub Actions audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Audit workflow supply chain
        uses: zizmorcore/zizmor-action@6fc4b006235f201fdab3722e17240ab420d580e5 # v0.6.1

  mobsfscan:
    name: MobSF Android source audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install pinned mobsfscan
        run: python3 -m pip install --disable-pip-version-check mobsfscan==1.0.0

      - name: Scan Android Java and XML
        run: |
          mkdir -p security-reports
          mobsfscan app/src/main --type android --sarif \
            --output security-reports/mobsfscan.sarif --no-fail
          mobsfscan --version > security-reports/mobsfscan-version.txt

          # MobSF's StrandHogg rule is for targetSdk < 29. Keep the exception valid
          # only while OptiShare explicitly targets a fixed modern Android SDK.
          target_sdk=$(awk '/targetSdk[[:space:]]+[0-9]+/ { print $2; exit }' app/build.gradle)
          if [[ -z "$target_sdk" || "$target_sdk" -lt 29 ]]; then
            echo "::error::The StrandHogg exception requires targetSdk 29 or newer."
            exit 1
          fi

          # Two reviewed source-only false positives:
          # 1) hiding the completed transfer's Pause button contains no sensitive data;
          # 2) StrandHogg 2.0 is platform-fixed for targetSdk >= 29.
          jq '
            [.runs[]?.results[]?
             | select(.level == "error" or .level == "warning")
             | select(
                 ((.ruleId == "android_hidden_ui")
                   and (.locations[0].physicalLocation.artifactLocation.uri == "app/src/main/java/com/kenan/optishare/V2Activity.java"))
                 or
                 ((.ruleId == "android_task_hijacking2")
                   and (.locations[0].physicalLocation.artifactLocation.uri == "app/src/main/AndroidManifest.xml"))
               )
            ]' security-reports/mobsfscan.sarif > security-reports/mobsfscan-reviewed-false-positives.json

          findings=$(jq '
            [.runs[]?.results[]?
             | select(.level == "error" or .level == "warning")
             | select(
                 (((.ruleId == "android_hidden_ui")
                   and (.locations[0].physicalLocation.artifactLocation.uri == "app/src/main/java/com/kenan/optishare/V2Activity.java"))
                 or
                 ((.ruleId == "android_task_hijacking2")
                   and (.locations[0].physicalLocation.artifactLocation.uri == "app/src/main/AndroidManifest.xml"))) | not
               )
            ] | length' security-reports/mobsfscan.sarif)
          echo "mobsfscan_actionable_findings=$findings" | tee security-reports/mobsfscan-summary.txt
          if (( findings > 0 )); then
            echo "::error::MobSF Android audit found actionable findings."
            exit 1
          fi

      - name: Upload MobSF source report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OptiShare-mobsfscan-report
          path: security-reports/
          if-no-files-found: error
          retention-days: 30

  workflow-lint:
    name: actionlint workflow syntax
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install checksum-verified actionlint 1.7.12
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSLo actionlint.tar.gz \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint.tar.gz' | sha256sum --check -
          tar -xzf actionlint.tar.gz actionlint
          ./actionlint -version
          ./actionlint -color

  apk-sbom:
    name: APK SBOM and Grype vulnerability gate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build analyzable debug APK
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Generate SPDX JSON SBOM from APK
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          file: app/build/outputs/apk/debug/app-debug.apk
          format: spdx-json
          output-file: security-reports/optishare-apk.spdx.json
          artifact-name: OptiShare-2.2-APK-SBOM.spdx.json
          upload-artifact: false

      - name: Scan APK SBOM with Grype
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          sbom: security-reports/optishare-apk.spdx.json
          fail-build: true
          severity-cutoff: high
          only-fixed: false
          output-format: sarif
          output-file: security-reports/grype-apk.sarif

      - name: Upload APK SBOM and vulnerability report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OptiShare-2.2-APK-supply-chain
          path: security-reports/
          if-no-files-found: error
          retention-days: 30
