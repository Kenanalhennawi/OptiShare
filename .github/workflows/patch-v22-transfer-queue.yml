name: Validate OptiShare 2.2 Transfer Queue

on:
  push:
    branches:
      - feature/v2.2-fast-transfer
    paths:
      - tools/patch_v22_transfer_queue.py
      - .github/workflows/patch-v22-transfer-queue.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  queue-polish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest branch
        uses: actions/checkout@v4
        with:
          ref: feature/v2.2-fast-transfer
          fetch-depth: 0
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Apply transfer queue patch
        run: python3 tools/patch_v22_transfer_queue.py
      - name: Verify transfer queue
        run: |
          git diff --check
          gradle --no-daemon --stacktrace testDebugUnitTest testReleaseUnitTest lintDebug lintRelease assembleDebug
      - name: Commit verified queue polish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/kenan/optishare/V2Activity.java app/src/main/java/com/kenan/optishare/transfer/TransferService.java
          if git diff --cached --quiet; then
            echo "No production changes to commit"
          else
            git commit -m "ux: add per-file transfer queue controls and status"
            git push origin HEAD:feature/v2.2-fast-transfer
          fi
