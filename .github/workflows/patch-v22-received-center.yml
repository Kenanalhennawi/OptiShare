name: Integrate OptiShare Received Files Center

on:
  push:
    branches:
      - feature/v2.2-fast-transfer

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout latest branch
        uses: actions/checkout@v4
        with:
          ref: feature/v2.2-fast-transfer
          fetch-depth: 0

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Apply received center patch
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/patch_v22_received_center.py
          git diff --check

      - name: Verify Android integration
        run: gradle --no-daemon --stacktrace testDebugUnitTest testReleaseUnitTest lintDebug lintRelease assembleDebug

      - name: Commit verified integration
        shell: bash
        run: |
          set -euo pipefail
          git add app/src/main/java/com/kenan/optishare/V2Activity.java
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat: link received files center from home"
          git pull --rebase origin feature/v2.2-fast-transfer
          git push origin HEAD:feature/v2.2-fast-transfer
