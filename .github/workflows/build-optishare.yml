name: Build OptiShare 2.1 Signed

on:
  push:
    branches:
      - rebuild/v2.1-signed-complete
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: optishare-2.1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test, lint, build and verify
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      EXPECTED_CERT_SHA256: c408ec09bdfa5b6186591a1beafa333323f8fc5f205b418116129bd3f90f60e3
      EXPECTED_JKS_SHA256: 714155b7dd73326504178197761fb8f3a1da0efa7e8a123eb963a6907a654323

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Quality gate and debug APK
        run: >-
          gradle --no-daemon --stacktrace clean
          testDebugUnitTest testReleaseUnitTest
          lintDebug lintRelease assembleDebug

      - name: Restore Base64 release keystore
        env:
          RAW_KEYSTORE_B64: ${{ secrets.OPTISHARE_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          if [ -z "${RAW_KEYSTORE_B64:-}" ]; then
            echo '::error::Missing GitHub Actions secret OPTISHARE_KEYSTORE_B64'
            exit 1
          fi

          KEYSTORE_B64="$RAW_KEYSTORE_B64"
          KEYSTORE_B64="${KEYSTORE_B64//$'\r'/}"
          KEYSTORE_B64="${KEYSTORE_B64//$'\n'/}"
          if [[ "$KEYSTORE_B64" == OPTISHARE_KEYSTORE_B64=* ]]; then
            KEYSTORE_B64="${KEYSTORE_B64#OPTISHARE_KEYSTORE_B64=}"
          elif [[ "$KEYSTORE_B64" == OPTISHARE_KEYSTORE_BASE64=* ]]; then
            KEYSTORE_B64="${KEYSTORE_B64#OPTISHARE_KEYSTORE_BASE64=}"
          fi

          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/optishare-release.jks" || {
            echo '::error::OPTISHARE_KEYSTORE_B64 is not valid Base64'
            exit 1
          }

          test -s "$RUNNER_TEMP/optishare-release.jks" || {
            echo '::error::Decoded release keystore is empty'
            exit 1
          }
          chmod 600 "$RUNNER_TEMP/optishare-release.jks"

          ACTUAL_JKS_SHA256=$(sha256sum "$RUNNER_TEMP/optishare-release.jks" | awk '{print $1}')
          if [ "$ACTUAL_JKS_SHA256" != "$EXPECTED_JKS_SHA256" ]; then
            echo "::error::Keystore SHA-256 mismatch. Got $ACTUAL_JKS_SHA256"
            exit 1
          fi

          echo "OPTISHARE_STORE_FILE=$RUNNER_TEMP/optishare-release.jks" >> "$GITHUB_ENV"
          echo 'Release keystore decoded and checksum verified.'

      - name: Normalize and validate all signing credentials
        env:
          RAW_STORE_PASSWORD: ${{ secrets.OPTISHARE_STORE_PASSWORD }}
          RAW_KEY_ALIAS: ${{ secrets.OPTISHARE_KEY_ALIAS }}
          RAW_KEY_PASSWORD: ${{ secrets.OPTISHARE_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          normalize_secret() {
            local name="$1"
            local value="$2"
            value="${value//$'\r'/}"
            value="${value//$'\n'/}"
            if [[ "$value" == "$name="* ]]; then
              value="${value#"$name="}"
            fi
            test -n "$value" || { echo "::error::Missing $name"; exit 1; }
            echo "::add-mask::$value"
            printf '%s' "$value"
          }

          STORE_PASSWORD="$(normalize_secret OPTISHARE_STORE_PASSWORD "$RAW_STORE_PASSWORD")"
          KEY_ALIAS="$(normalize_secret OPTISHARE_KEY_ALIAS "$RAW_KEY_ALIAS")"
          KEY_PASSWORD="$(normalize_secret OPTISHARE_KEY_PASSWORD "$RAW_KEY_PASSWORD")"

          if ! keytool -list -keystore "$OPTISHARE_STORE_FILE" -storepass "$STORE_PASSWORD" >/dev/null 2>&1; then
            echo '::error::OPTISHARE_STORE_PASSWORD does not unlock the verified release keystore'
            exit 1
          fi

          if ! keytool -list -keystore "$OPTISHARE_STORE_FILE" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null 2>&1; then
            echo '::error::OPTISHARE_KEY_ALIAS does not exist in the verified release keystore'
            exit 1
          fi

          printf 'OptiShare signing probe\n' > "$RUNNER_TEMP/signing-probe.txt"
          jar --create --file "$RUNNER_TEMP/signing-probe.jar" -C "$RUNNER_TEMP" signing-probe.txt
          if ! jarsigner -keystore "$OPTISHARE_STORE_FILE" -storepass "$STORE_PASSWORD" -keypass "$KEY_PASSWORD" "$RUNNER_TEMP/signing-probe.jar" "$KEY_ALIAS" >/dev/null 2>&1; then
            echo '::error::OPTISHARE_KEY_PASSWORD does not unlock the private signing key'
            exit 1
          fi

          {
            echo "OPTISHARE_STORE_PASSWORD=$STORE_PASSWORD"
            echo "OPTISHARE_KEY_ALIAS=$KEY_ALIAS"
            echo "OPTISHARE_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

          echo 'All four signing inputs validated successfully.'

      - name: Build signed release APK and Play AAB
        env:
          ORG_GRADLE_PROJECT_OPTISHARE_STORE_FILE: ${{ env.OPTISHARE_STORE_FILE }}
          ORG_GRADLE_PROJECT_OPTISHARE_STORE_PASSWORD: ${{ env.OPTISHARE_STORE_PASSWORD }}
          ORG_GRADLE_PROJECT_OPTISHARE_KEY_ALIAS: ${{ env.OPTISHARE_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_OPTISHARE_KEY_PASSWORD: ${{ env.OPTISHARE_KEY_PASSWORD }}
        run: gradle --no-daemon --stacktrace assembleRelease bundleRelease

      - name: Verify Android signature and signer identity
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          AAB=app/build/outputs/bundle/release/app-release.aab
          test -s "$APK" || { echo '::error::Signed release APK was not produced'; exit 1; }
          test -s "$AAB" || { echo '::error::Release AAB was not produced'; exit 1; }

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" | tee "$RUNNER_TEMP/apksigner.txt"
          ACTUAL_CERT=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/apksigner.txt" | head -n1 | tr '[:upper:]' '[:lower:]' | tr -d ':[:space:]')
          test -n "$ACTUAL_CERT" || { echo '::error::Could not read APK signer SHA-256'; exit 1; }
          if [ "$ACTUAL_CERT" != "$EXPECTED_CERT_SHA256" ]; then
            echo "::error::Unexpected release signing certificate: $ACTUAL_CERT"
            exit 1
          fi
          echo 'APK signature and signer certificate verified.'

      - name: Create release metadata and checksums
        run: |
          set -euo pipefail
          mkdir -p release-output
          cp app/build/outputs/apk/release/app-release.apk release-output/OptiShare-2.1-SIGNED.apk
          cp app/build/outputs/bundle/release/app-release.aab release-output/OptiShare-2.1-Play.aab
          (
            cd release-output
            sha256sum OptiShare-2.1-SIGNED.apk OptiShare-2.1-Play.aab > SHA256SUMS.txt
          )
          {
            echo 'version=2.1.0'
            echo "commit=${GITHUB_SHA}"
            echo "signer_sha256=${EXPECTED_CERT_SHA256}"
            echo "keystore_sha256=${EXPECTED_JKS_SHA256}"
            echo "built_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > release-output/BUILD_INFO.txt

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: OptiShare-2.1-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload signed release bundle
        uses: actions/upload-artifact@v4
        with:
          name: OptiShare-2.1-FINAL-SIGNED
          path: |
            release-output/OptiShare-2.1-SIGNED.apk
            release-output/OptiShare-2.1-Play.aab
            release-output/SHA256SUMS.txt
            release-output/BUILD_INFO.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload quality reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OptiShare-2.1-quality-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.*
            app/build/reports/lint-results-release.*
          if-no-files-found: ignore
          retention-days: 14
