name: Build OptiShare 3.0

on:
  push:
    branches: ['update/v3.0-product']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: optishare-3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      OPTISHARE_KEYSTORE_B64: ${{ secrets.OPTISHARE_KEYSTORE_B64 }}
      OPTISHARE_STORE_PASSWORD: ${{ secrets.OPTISHARE_STORE_PASSWORD }}
      OPTISHARE_KEY_ALIAS: ${{ secrets.OPTISHARE_KEY_ALIAS }}
      OPTISHARE_KEY_PASSWORD: ${{ secrets.OPTISHARE_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Clean project
        run: gradle --no-daemon clean
      - name: Run debug unit tests
        run: gradle --no-daemon testDebugUnitTest
      - name: Run release unit tests
        run: gradle --no-daemon testReleaseUnitTest
      - name: Run debug Android lint
        run: gradle --no-daemon lintDebug
      - name: Run release Android lint
        run: gradle --no-daemon lintRelease
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Upload unit-test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OptiShare-3.0-unit-test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore
      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OptiShare-3.0-lint-reports
          path: |
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-release.html
            app/build/reports/lint-results-debug.xml
            app/build/reports/lint-results-release.xml
          if-no-files-found: ignore
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: OptiShare-3.0-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Restore release keystore
        if: ${{ env.OPTISHARE_KEYSTORE_B64 != '' }}
        shell: bash
        run: |
          set -euo pipefail
          echo "$OPTISHARE_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/optishare-release.jks"
          test -s "$RUNNER_TEMP/optishare-release.jks"
      - name: Build signed release APK and Play AAB
        if: ${{ env.OPTISHARE_KEYSTORE_B64 != '' }}
        env:
          ORG_GRADLE_PROJECT_OPTISHARE_STORE_FILE: ${{ runner.temp }}/optishare-release.jks
          ORG_GRADLE_PROJECT_OPTISHARE_STORE_PASSWORD: ${{ env.OPTISHARE_STORE_PASSWORD }}
          ORG_GRADLE_PROJECT_OPTISHARE_KEY_ALIAS: ${{ env.OPTISHARE_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_OPTISHARE_KEY_PASSWORD: ${{ env.OPTISHARE_KEY_PASSWORD }}
        run: gradle --no-daemon assembleRelease bundleRelease
      - name: Create release checksums
        if: ${{ env.OPTISHARE_KEYSTORE_B64 != '' }}
        shell: bash
        run: |
          set -euo pipefail
          cd app/build/outputs
          sha256sum apk/release/app-release.apk bundle/release/app-release.aab > SHA256SUMS.txt
      - name: Verify release artifacts exist
        if: ${{ env.OPTISHARE_KEYSTORE_B64 != '' }}
        shell: bash
        run: |
          set -euo pipefail
          test -s app/build/outputs/apk/release/app-release.apk
          test -s app/build/outputs/bundle/release/app-release.aab
          test -s app/build/outputs/SHA256SUMS.txt
      - name: Upload signed release APK
        if: ${{ env.OPTISHARE_KEYSTORE_B64 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: OptiShare-3.0-signed-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
      - name: Upload Google Play AAB
        if: ${{ env.OPTISHARE_KEYSTORE_B64 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: OptiShare-3.0-google-play-aab
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
      - name: Upload release checksums
        if: ${{ env.OPTISHARE_KEYSTORE_B64 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: OptiShare-3.0-checksums
          path: app/build/outputs/SHA256SUMS.txt
          if-no-files-found: error
