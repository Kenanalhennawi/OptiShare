name: Build OptiShare 2.1 Signed

on:
  push:
    branches:
      - rebuild/v2.1-signed-complete
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: optishare-2.1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test, lint, build and verify
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      EXPECTED_CERT_SHA256: c408ec09bdfa5b6186591a1beafa333323f8fc5f205b418116129bd3f90f60e3
      EXPECTED_JKS_SHA256: 714155b7dd73326504178197761fb8f3a1da0efa7e8a123eb963a6907a654323

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Quality gate and debug APK
        run: >-
          gradle --no-daemon --stacktrace clean
          testDebugUnitTest testReleaseUnitTest
          lintDebug lintRelease assembleDebug

      - name: Normalize signing secrets
        env:
          RAW_ENCRYPTION_PASSWORD: ${{ secrets.OPTISHARE_KEYSTORE_ENCRYPTION_PASSWORD }}
          RAW_STORE_PASSWORD: ${{ secrets.OPTISHARE_STORE_PASSWORD }}
          RAW_KEY_ALIAS: ${{ secrets.OPTISHARE_KEY_ALIAS }}
          RAW_KEY_PASSWORD: ${{ secrets.OPTISHARE_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          normalize_secret() {
            local name="$1"
            local value="$2"
            value="${value//$'\r'/}"
            value="${value//$'\n'/}"
            if [[ "$value" == "$name="* ]]; then
              value="${value#"$name="}"
            fi
            test -n "$value" || { echo "::error::Missing $name"; exit 1; }
            echo "::add-mask::$value"
            printf '%s=%s\n' "$name" "$value" >> "$GITHUB_ENV"
          }

          normalize_secret OPTISHARE_KEYSTORE_ENCRYPTION_PASSWORD "$RAW_ENCRYPTION_PASSWORD"
          normalize_secret OPTISHARE_STORE_PASSWORD "$RAW_STORE_PASSWORD"
          normalize_secret OPTISHARE_KEY_ALIAS "$RAW_KEY_ALIAS"
          normalize_secret OPTISHARE_KEY_PASSWORD "$RAW_KEY_PASSWORD"

      - name: Validate signing inputs
        run: |
          set -euo pipefail
          test -s .github/signing/optishare-release.jks.enc || { echo '::error::Encrypted keystore payload missing'; exit 1; }
          test "$(head -c 8 .github/signing/optishare-release.jks.enc)" = "Salted__" || {
            echo '::error::Encrypted keystore payload has invalid OpenSSL header'
            exit 1
          }

      - name: Restore and validate release keystore
        run: |
          set -euo pipefail
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
            -in .github/signing/optishare-release.jks.enc \
            -out "$RUNNER_TEMP/optishare-release.jks" \
            -pass env:OPTISHARE_KEYSTORE_ENCRYPTION_PASSWORD
          chmod 600 "$RUNNER_TEMP/optishare-release.jks"

          ACTUAL_JKS_SHA256=$(sha256sum "$RUNNER_TEMP/optishare-release.jks" | awk '{print $1}')
          test "$ACTUAL_JKS_SHA256" = "$EXPECTED_JKS_SHA256" || {
            echo "::error::Restored JKS checksum mismatch: $ACTUAL_JKS_SHA256"
            exit 1
          }

          keytool -list \
            -keystore "$RUNNER_TEMP/optishare-release.jks" \
            -storepass "$OPTISHARE_STORE_PASSWORD" \
            -alias "$OPTISHARE_KEY_ALIAS" >/dev/null
          echo 'Release keystore restored and validated.'

      - name: Build signed release APK and Play AAB
        run: |
          set -euo pipefail
          export ORG_GRADLE_PROJECT_OPTISHARE_STORE_FILE="$RUNNER_TEMP/optishare-release.jks"
          export ORG_GRADLE_PROJECT_OPTISHARE_STORE_PASSWORD="$OPTISHARE_STORE_PASSWORD"
          export ORG_GRADLE_PROJECT_OPTISHARE_KEY_ALIAS="$OPTISHARE_KEY_ALIAS"
          export ORG_GRADLE_PROJECT_OPTISHARE_KEY_PASSWORD="$OPTISHARE_KEY_PASSWORD"
          gradle --no-daemon --stacktrace assembleRelease bundleRelease

      - name: Verify Android signature and signer identity
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" | tee /tmp/apksigner.txt
          ACTUAL=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' /tmp/apksigner.txt | head -n1 | tr '[:upper:]' '[:lower:]' | tr -d ':[:space:]')
          test -n "$ACTUAL" || { echo '::error::Could not read signer SHA-256'; exit 1; }
          test "$ACTUAL" = "$EXPECTED_CERT_SHA256" || {
            echo "::error::Unexpected release signing certificate: $ACTUAL"
            exit 1
          }

      - name: Create release metadata and checksums
        run: |
          set -euo pipefail
          mkdir -p release-output
          cp app/build/outputs/apk/release/app-release.apk release-output/OptiShare-2.1-SIGNED.apk
          cp app/build/outputs/bundle/release/app-release.aab release-output/OptiShare-2.1-Play.aab
          (
            cd release-output
            sha256sum OptiShare-2.1-SIGNED.apk OptiShare-2.1-Play.aab > SHA256SUMS.txt
          )
          {
            echo "version=2.1.0"
            echo "commit=${GITHUB_SHA}"
            echo "signer_sha256=${EXPECTED_CERT_SHA256}"
            echo "built_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > release-output/BUILD_INFO.txt

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: OptiShare-2.1-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload signed release bundle
        uses: actions/upload-artifact@v4
        with:
          name: OptiShare-2.1-FINAL-SIGNED
          path: |
            release-output/OptiShare-2.1-SIGNED.apk
            release-output/OptiShare-2.1-Play.aab
            release-output/SHA256SUMS.txt
            release-output/BUILD_INFO.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload quality reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OptiShare-2.1-quality-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.*
            app/build/reports/lint-results-release.*
          if-no-files-found: ignore
          retention-days: 14
