name: Patch OptiShare 2.2 Live Transfer UI

on:
  push:
    branches: ['feature/v2.2-fast-transfer']
    paths: ['.github/workflows/patch-v22-live-ui.yml']

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v2.2-fast-transfer
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Apply focused live-metrics UI patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/kenan/optishare/V2Activity.java')
          s = p.read_text()

          old = '''            String message = intent.getStringExtra(TransferService.EXTRA_MESSAGE);\n            int progress = intent.getIntExtra(TransferService.EXTRA_PROGRESS, 0);\n            if (event == null) return;'''
          new = '''            String message = intent.getStringExtra(TransferService.EXTRA_MESSAGE);\n            int progress = intent.getIntExtra(TransferService.EXTRA_PROGRESS, 0);\n            double speed = intent.getDoubleExtra(TransferService.EXTRA_SPEED, 0d);\n            long done = intent.getLongExtra(TransferService.EXTRA_DONE, 0L);\n            long total = intent.getLongExtra(TransferService.EXTRA_TOTAL, 0L);\n            long etaSeconds = intent.getLongExtra(TransferService.EXTRA_ETA_SECONDS, 0L);\n            if (event == null) return;'''
          assert old in s, 'receiver metrics anchor not found'
          s = s.replace(old, new, 1)

          old = '''            } else if ("progress".equals(event)) {\n                setTransferUi(receiverMode ? "Receiving…" : "Sending…", message, progress);\n            } else if ("reconnecting".equals(event)) {'''
          new = '''            } else if ("progress".equals(event)) {\n                setTransferUi(receiverMode ? "Receiving…" : "Sending…", message, progress);\n                setTransferMetrics(progress, done, total, speed, etaSeconds);\n            } else if ("reconnecting".equals(event)) {'''
          assert old in s, 'progress event anchor not found'
          s = s.replace(old, new, 1)

          old = '''        LinearLayout card=card();transferState=text("Preparing transfer…",21,Color.WHITE,true);card.addView(transferState);transferDetail=text("Negotiating encrypted session and resume offsets",13,Color.rgb(158,188,211),false);card.addView(transferDetail);\n        transferProgress=new ProgressBar(this,null,android.R.attr.progressBarStyleHorizontal);transferProgress.setMax(100);LinearLayout.LayoutParams pp=new LinearLayout.LayoutParams(-1,dp(9));pp.setMargins(0,dp(14),0,0);card.addView(transferProgress,pp);root.addView(card);'''
          new = '''        LinearLayout card=card();transferState=text("Preparing transfer…",21,Color.WHITE,true);card.addView(transferState);transferDetail=text("Negotiating encrypted session and resume offsets",13,Color.rgb(158,188,211),false);card.addView(transferDetail);\n        TextView percent=text("0%",42,Color.WHITE,true);percent.setTag("transfer_percent");percent.setGravity(Gravity.CENTER);percent.setPadding(0,dp(16),0,dp(4));card.addView(percent);\n        transferProgress=new ProgressBar(this,null,android.R.attr.progressBarStyleHorizontal);transferProgress.setMax(100);LinearLayout.LayoutParams pp=new LinearLayout.LayoutParams(-1,dp(9));pp.setMargins(0,dp(8),0,0);card.addView(transferProgress,pp);\n        LinearLayout metrics=new LinearLayout(this);metrics.setOrientation(LinearLayout.HORIZONTAL);metrics.setPadding(0,dp(14),0,0);\n        TextView bytes=text("0 B / —",13,Color.rgb(187,215,235),true);bytes.setTag("transfer_bytes");metrics.addView(bytes,new LinearLayout.LayoutParams(0,-2,1));\n        TextView speedView=text("— MB/s",13,Color.rgb(89,205,255),true);speedView.setTag("transfer_speed");speedView.setGravity(Gravity.CENTER);metrics.addView(speedView,new LinearLayout.LayoutParams(0,-2,1));\n        TextView eta=text("ETA —",13,Color.rgb(187,215,235),true);eta.setTag("transfer_eta");eta.setGravity(Gravity.RIGHT);metrics.addView(eta,new LinearLayout.LayoutParams(0,-2,1));\n        card.addView(metrics);root.addView(card);'''
          assert old in s, 'transfer screen anchor not found'
          s = s.replace(old, new, 1)

          old = '''    private void setTransferUi(String title,String detail,int progress){runOnUiThread(()->{if(transferState!=null)transferState.setText(title);if(transferDetail!=null)transferDetail.setText(detail);if(transferProgress!=null&&progress>=0)transferProgress.setProgress(progress);});}\n\n    private void refreshReceiverIdentity() {'''
          new = '''    private void setTransferUi(String title,String detail,int progress){runOnUiThread(()->{if(transferState!=null)transferState.setText(title);if(transferDetail!=null)transferDetail.setText(detail);if(transferProgress!=null&&progress>=0)transferProgress.setProgress(progress);if(progress>=0){TextView percent=findViewByTag("transfer_percent");if(percent!=null)percent.setText(progress+"%");}});}\n\n    private void setTransferMetrics(int progress,long done,long total,double speed,long etaSeconds){runOnUiThread(()->{TextView percent=findViewByTag("transfer_percent");TextView bytes=findViewByTag("transfer_bytes");TextView speedView=findViewByTag("transfer_speed");TextView eta=findViewByTag("transfer_eta");if(percent!=null)percent.setText(Math.max(0,Math.min(100,progress))+"%");if(bytes!=null)bytes.setText(formatBytes(Math.max(0L,done))+" / "+(total>0?formatBytes(total):"—"));if(speedView!=null)speedView.setText(formatTransferSpeed(speed));if(eta!=null)eta.setText(formatEta(etaSeconds));});}\n\n    private String formatTransferSpeed(double bytesPerSecond){if(bytesPerSecond>=1024d*1024d)return String.format(Locale.US,"%.1f MB/s",bytesPerSecond/(1024d*1024d));if(bytesPerSecond>=1024d)return String.format(Locale.US,"%.0f KB/s",bytesPerSecond/1024d);return bytesPerSecond>0?String.format(Locale.US,"%.0f B/s",bytesPerSecond):"— MB/s";}\n    private String formatEta(long seconds){if(seconds<=0)return"ETA —";if(seconds<60)return"ETA "+seconds+"s";long minutes=seconds/60;long remain=seconds%60;return"ETA "+minutes+"m "+remain+"s";}\n\n    private void refreshReceiverIdentity() {'''
          assert old in s, 'setTransferUi anchor not found'
          s = s.replace(old, new, 1)

          p.write_text(s)
          PY

          git diff --check
          git diff -- app/src/main/java/com/kenan/optishare/V2Activity.java

      - name: Compile and test patched app
        run: gradle --no-daemon --stacktrace testDebugUnitTest testReleaseUnitTest lintDebug assembleDebug

      - name: Commit verified patch
        shell: bash
        run: |
          git config user.name "Kenanalhennawi"
          git config user.email "135068266+Kenanalhennawi@users.noreply.github.com"
          git add app/src/main/java/com/kenan/optishare/V2Activity.java
          git commit -m "ui: add live transfer speed bytes and ETA panel"
          git push origin HEAD:feature/v2.2-fast-transfer
