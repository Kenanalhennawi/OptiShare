name: OptiShare Security Scan

on:
  workflow_dispatch:
  push:
    branches:
      - feature/v2.2-fast-transfer
    paths:
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - 'windows/**'
      - '.github/workflows/security-scan.yml'

permissions:
  contents: read

concurrency:
  group: optishare-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semgrep-trivy-gitleaks:
    name: Semgrep, Trivy and Gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout complete history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare private reports directory
        run: mkdir -p security-reports

      - name: Semgrep Android and security rules
        run: |
          docker run --rm -v "$PWD:/src" semgrep/semgrep:latest             semgrep scan             --config p/java             --config p/security-audit             --config p/owasp-top-ten             --exclude windows/publish             --exclude app/build             --json-output /src/security-reports/semgrep.json             --sarif-output /src/security-reports/semgrep.sarif             /src
          docker run --rm semgrep/semgrep:latest semgrep --version             > security-reports/semgrep-version.txt

      - name: Trivy dependencies and configuration
        run: |
          docker run --rm -v "$PWD:/repo" aquasec/trivy:latest             fs --scanners vuln,misconfig             --severity HIGH,CRITICAL             --format json             --output /repo/security-reports/trivy.json             /repo
          docker run --rm aquasec/trivy:latest --version             > security-reports/trivy-version.txt

      - name: Gitleaks complete Git history
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:latest             detect --source=/repo             --report-format=json             --report-path=/repo/security-reports/gitleaks.json             --redact=100             --exit-code=0
          docker run --rm ghcr.io/gitleaks/gitleaks:latest version             > security-reports/gitleaks-version.txt

      - name: Summarize and enforce security gate
        shell: bash
        run: |
          set -euo pipefail
          semgrep_count=$(jq '[.results[]? | select(.extra.severity == "ERROR")] | length' security-reports/semgrep.json)
          trivy_count=$(jq '[.Results[]? | .Vulnerabilities[]? | select(.Severity == "HIGH" or .Severity == "CRITICAL")] | length' security-reports/trivy.json)
          gitleaks_count=$(jq 'length' security-reports/gitleaks.json)
          {
            echo "semgrep_error_findings=$semgrep_count"
            echo "trivy_high_critical_findings=$trivy_count"
            echo "gitleaks_findings=$gitleaks_count"
          } | tee security-reports/SUMMARY.txt
          if (( semgrep_count > 0 || trivy_count > 0 || gitleaks_count > 0 )); then
            echo "::error::Security gate found actionable findings. Review the redacted artifacts."
            exit 1
          fi

      - name: Upload redacted security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OptiShare-security-reports
          path: security-reports/
          if-no-files-found: error
          retention-days: 30
